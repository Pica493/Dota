<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ancient Clash — Prototype</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070d;color:#eaf2ff;
    font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
  #game{position:fixed;inset:0}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  #topbar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.65);padding:6px 18px;border-radius:20px;font-size:clamp(12px,1.2vw,15px);
    display:flex;gap:18px;align-items:center;border:1px solid rgba(255,255,255,.1)}
  #topbar b{color:#fbbf24}

  #stats{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));
    background:rgba(0,0,0,.65);padding:8px 12px;border-radius:8px;
    font-size:clamp(11px,1.1vw,13px);line-height:1.55;border:1px solid rgba(255,255,255,.1)}

  #attr-panel{position:absolute;top:calc(10px + env(safe-area-inset-top));
    right:calc(10px + env(safe-area-inset-right));
    background:rgba(0,0,0,.7);padding:10px 12px;border-radius:10px;
    pointer-events:auto;font-size:clamp(12px,1.2vw,14px);
    border:1px solid rgba(255,255,255,.1)}
  .attr-row{display:flex;align-items:center;gap:10px;margin:5px 0}
  .attr-row .name{width:34px;font-weight:700;letter-spacing:.5px}
  .attr-row .val{width:34px;text-align:right;color:#9ad}
  .attr-btn{width:26px;height:26px;border-radius:6px;border:none;cursor:pointer;
    background:#fbbf24;color:#000;font-weight:900;font-size:16px;line-height:1}
  .attr-btn:disabled{opacity:.25;cursor:default}

  #bars{position:absolute;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:min(420px,60vw)}
  .bar{height:16px;background:rgba(0,0,0,.7);border:2px solid #222;border-radius:5px;
    overflow:hidden;margin-bottom:5px;position:relative}
  .bar-fill{height:100%;transition:width .12s;border-radius:2px}
  .hp .bar-fill{background:linear-gradient(to bottom,#4ade80,#15803d)}
  .mana .bar-fill{background:linear-gradient(to bottom,#60a5fa,#1d4ed8)}
  .bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}

  #abilities{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
  .ability{width:clamp(52px,7vw,72px);height:clamp(52px,7vw,72px);border-radius:50%;
    background:rgba(15,25,45,.92);border:3px solid #4aa3ff;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:clamp(18px,2vw,26px);cursor:pointer;position:relative;
    transition:transform .08s;color:#eaf2ff}
  .ability:active{transform:scale(.94)}
  .ability .cd{position:absolute;inset:0;border-radius:50%;
    background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;
    font-size:clamp(16px,1.8vw,22px);color:#fff}
  .ability .lvl{position:absolute;bottom:-4px;right:-4px;
    background:#fbbf24;color:#000;border-radius:50%;
    width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:900;border:2px solid #000}

  #message{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
    font-size:clamp(32px,6vw,72px);font-weight:900;text-shadow:0 0 30px #000,0 0 60px #000;
    opacity:0;transition:opacity .5s;pointer-events:none;text-align:center}
  #message.show{opacity:1}

  #hint{position:absolute;bottom:calc(4px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%);font-size:10px;opacity:.35;white-space:nowrap}

  #rotate{display:none;position:fixed;inset:0;background:#05070d;z-index:9999;
    align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px}
  @media (orientation:portrait){
    #rotate{display:flex}
    #game,#hud{display:none}
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="topbar">
    <span id="timer">00:00</span>
    <span style="color:#6ee7a8">Radiant <b id="radiant-score">0</b></span>
    <span style="color:#f87171">Dire <b id="dire-score">0</b></span>
  </div>
  <div id="stats"></div>
  <div id="attr-panel">
    <div class="attr-row"><span class="name">STR</span><span class="val" id="str-val">0</span>
      <button class="attr-btn" data-attr="STR">+</button></div>
    <div class="attr-row"><span class="name">AGI</span><span class="val" id="agi-val">0</span>
      <button class="attr-btn" data-attr="AGI">+</button></div>
    <div class="attr-row"><span class="name">INT</span><span class="val" id="int-val">0</span>
      <button class="attr-btn" data-attr="INT">+</button></div>
    <div style="font-size:11px;opacity:.75;margin-top:6px;text-align:right">
      Очков: <b id="attr-pts" style="color:#fbbf24">0</b>
    </div>
  </div>
  <div id="bars">
    <div class="bar hp"><div class="bar-fill" id="hp-fill" style="width:100%"></div><span id="hp-txt"></span></div>
    <div class="bar mana"><div class="bar-fill" id="mana-fill" style="width:100%"></div><span id="mana-txt"></span></div>
  </div>
  <div id="abilities">
    <div class="ability" data-key="Q">Q<div class="cd" style="display:none"></div></div>
    <div class="ability" data-key="W">W<div class="cd" style="display:none"></div></div>
    <div class="ability" data-key="E">E<div class="cd" style="display:none"></div></div>
    <div class="ability" data-key="R">R<div class="cd" style="display:none"></div></div>
  </div>
  <div id="hint">ПКМ: движение · WASD: ходьба · Q/W/E/R: способности · 1–4: прокачать · Клик по «+»: атрибуты · Колесо: зум</div>
  <div id="message"></div>
</div>
<div id="rotate">📱 Поверните устройство горизонтально</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONFIG
============================================================ */
const CONFIG = { MAP: 140, CREEP_INT: 20, MAX_LVL: 25 };
const TEAM = { RADIANT: 0, DIRE: 1 };
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const RADIANT_BASE = V3(-55,0,55);
const DIRE_BASE    = V3( 55,0,-55);

/* ============================================================
   SCENE / LIGHTS / CAMERA
============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9dc4e8);
scene.fog = new THREE.Fog(0x9dc4e8, 110, 230);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 500);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('game').appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(0xfff0c8, 1.9);
sun.position.set(60, 110, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -90; sun.shadow.camera.right = 90;
sun.shadow.camera.top = 90;   sun.shadow.camera.bottom = -90;
sun.shadow.camera.far = 320;
sun.shadow.bias = -0.0008;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x40502a, 0.85));

/* ============================================================
   MAP
============================================================ */
const mapGroup = new THREE.Group(); scene.add(mapGroup);

// Ground
const groundGeo = new THREE.PlaneGeometry(CONFIG.MAP, CONFIG.MAP, 40, 40);
const gp = groundGeo.attributes.position;
for (let i=0;i<gp.count;i++){
  const x=gp.getX(i), y=gp.getY(i), d=Math.hypot(x,y);
  if (d>8) gp.setZ(i, (Math.sin(x*0.35)+Math.cos(y*0.4))*0.25);
}
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo, new THREE.MeshToonMaterial({ color:0x5f8f4f }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
mapGroup.add(ground);

// River
const river = new THREE.Mesh(
  new THREE.PlaneGeometry(CONFIG.MAP*1.5, 16),
  new THREE.MeshPhysicalMaterial({ color:0x2a7faa, transparent:true, opacity:0.72,
    roughness:0.15, metalness:0.4, clearcoat:0.8 })
);
river.rotation.x = -Math.PI/2; river.rotation.z = Math.PI/4; river.position.y = 0.06;
mapGroup.add(river);

// Trees (instanced)
(function trees(){
  const count = 320;
  const crownGeo = new THREE.ConeGeometry(1.2, 4, 6);
  const trunkGeo = new THREE.CylinderGeometry(0.28, 0.4, 1.4, 6);
  const crownMat = new THREE.MeshToonMaterial({ color:0x2d5a2d });
  const trunkMat = new THREE.MeshToonMaterial({ color:0x5a3a1a });
  const crown = new THREE.InstancedMesh(crownGeo, crownMat, count);
  const trunk = new THREE.InstancedMesh(trunkGeo, trunkMat, count);
  crown.castShadow = trunk.castShadow = true;
  crown.receiveShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  let placed = 0, guard = 0;
  while (placed < count && guard++ < count*10) {
    const x = (Math.random()-0.5)*(CONFIG.MAP-12);
    const z = (Math.random()-0.5)*(CONFIG.MAP-12);
    if (Math.abs(x-z) < 14) continue;         // river/mid lane
    if (Math.abs(x+z) < 6 && Math.abs(x) > 30) continue; // base approach
    if (Math.hypot(x-(-55),z-55) < 14) continue;
    if (Math.hypot(x-55,z-(-55)) < 14) continue;
    const sc = 0.7 + Math.random()*0.7;
    s.set(sc, sc, sc);
    q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.random()*Math.PI*2);
    m.compose(V3(x, 2.5*sc, z), q, s); crown.setMatrixAt(placed, m);
    m.compose(V3(x, 0.7*sc, z), q, s); trunk.setMatrixAt(placed, m);
    placed++;
  }
  crown.count = trunk.count = placed;
  mapGroup.add(crown, trunk);
})();

// Bases
function makeBase(x, z, color){
  const g = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(10, 11.5, 0.6, 32),
    new THREE.MeshToonMaterial({ color })
  );
  base.position.y = 0.3; base.receiveShadow = true; g.add(base);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(10.4, 12, 32),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.4, side:THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI/2; ring.position.y = 0.65; g.add(ring);
  g.position.set(x, 0, z); return g;
}
mapGroup.add(makeBase(-55, 55, 0x3a9b4a));
mapGroup.add(makeBase( 55,-55, 0x8a2a4a));

/* ============================================================
   LANES
============================================================ */
const LANE_PATHS = {
  top: [RADIANT_BASE.clone(), V3(-60,0,-60), V3(-20,0,-62), DIRE_BASE.clone()],
  mid: [RADIANT_BASE.clone(), V3(0,0,0),     DIRE_BASE.clone()],
  bot: [RADIANT_BASE.clone(), V3( 60,0, 60), V3( 20,0, 62), DIRE_BASE.clone()],
};
const LANE_CURVES = {};
for (const k in LANE_PATHS){
  LANE_CURVES[k] = new THREE.CatmullRomCurve3(LANE_PATHS[k]);
  // subtle lane tint
  const geo = new THREE.TubeGeometry(LANE_CURVES[k], 80, 3, 6, false);
  const mat = new THREE.MeshBasicMaterial({ color:0x9a8040, transparent:true, opacity:0.12 });
  const tube = new THREE.Mesh(geo, mat); tube.position.y = 0.07;
  mapGroup.add(tube);
}
const sampleLane = (lane, t) => LANE_CURVES[lane].getPoint(t);

/* ============================================================
   ENTITY CORE
============================================================ */
const allUnits = [];   // all damageable entities
const projectiles = [];
const keys = {};       // global input state

class Unit {
  constructor({ team, pos, hp, dmg, range, speed, atkSpeed, type, color, size=1 }) {
    this.team = team;
    this.pos = pos.clone();
    this.maxHp = hp; this.hp = hp;
    this.dmg = dmg; this.range = range;
    this.speed = speed; this.atkSpeed = atkSpeed;
    this.type = type; this.color = color;
    this.alive = true; this.atkCd = 0;
    this.target = null; this.moveTarget = null;
    this.stunTimer = 0; this.size = size;
    this.isAncient = false;

    const g = new THREE.Group();
    let head = null;

    if (type === 'hero') {
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.65, 1.0, 6, 12),
        new THREE.MeshToonMaterial({ color })
      );
      body.position.y = 1.15;
      const headMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.55, 14, 14),
        new THREE.MeshToonMaterial({ color:0xffd9b3 })
      );
      headMesh.position.y = 2.15;
      // simple "hat" marker for team
      const hat = new THREE.Mesh(
        new THREE.ConeGeometry(0.7, 0.9, 8),
        new THREE.MeshToonMaterial({ color: team===TEAM.RADIANT?0x44ff88:0xff4466 })
      );
      hat.position.y = 2.85;
      g.add(body, headMesh, hat);
    } else if (type === 'tower') {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 3.2, 3, 8),
        new THREE.MeshToonMaterial({ color:0x505064 }));
      base.position.y = 1.5;
      const top = new THREE.Mesh(new THREE.ConeGeometry(2.6, 3.5, 8),
        new THREE.MeshToonMaterial({ color }));
      top.position.y = 4.9;
      const flag = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 10),
        new THREE.MeshBasicMaterial({ color: team===TEAM.RADIANT?0x66ff99:0xff6699 }));
      flag.position.y = 7;
      g.add(base, top, flag);
    } else if (type === 'ancient') {
      const body = new THREE.Mesh(new THREE.IcosahedronGeometry(3.2, 1),
        new THREE.MeshToonMaterial({ color }));
      body.position.y = 3.5;
      const light = new THREE.PointLight(color, 3.5, 20);
      light.position.y = 4;
      g.add(body, light);
      // rotating ring
      const ring = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.15, 8, 32),
        new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.6 }));
      ring.rotation.x = Math.PI/2; ring.position.y = 1;
      g.add(ring); this._ring = ring;
    } else if (type === 'creep') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.75, 0.75),
        new THREE.MeshToonMaterial({ color }));
      body.position.y = 0.5;
      const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.38, 10, 10),
        new THREE.MeshToonMaterial({ color:0xffd9b3 }));
      headMesh.position.y = 1.15;
      g.add(body, headMesh);
    } else if (type === 'creep_ranged') {
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.3, 8),
        new THREE.MeshToonMaterial({ color }));
      body.position.y = 0.7;
      g.add(body);
    }

    g.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
    g.position.copy(this.pos);
    scene.add(g);
    this.mesh = g;

    // Healthbar (billboard sprite)
    const barCanvas = document.createElement('canvas');
    barCanvas.width = 128; barCanvas.height = 16;
    this.barCanvas = barCanvas;
    this.barCtx = barCanvas.getContext('2d');
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ depthTest:false, transparent:true }));
    sprite.scale.set(1.8, 0.22, 1);
    sprite.position.y = type==='hero'?3.3 : type==='tower'?7.6 : type==='ancient'?8 : 1.9;
    g.add(sprite);
    this.barSprite = sprite;
    this.barY = sprite.position.y;
    this.barWidth = 1.8;

    allUnits.push(this);
  }

  drawBar(){
    const c = this.barCtx, w = 128, h = 16;
    c.clearRect(0,0,w,h);
    c.fillStyle = 'rgba(0,0,0,0.75)'; c.fillRect(0,0,w,h);
    const pct = Math.max(0, this.hp/this.maxHp);
    const team = this.team === TEAM.RADIANT ? '#4ade80' : '#ef4444';
    c.fillStyle = team; c.fillRect(1,1,(w-2)*pct,h-2);
    c.strokeStyle = '#000'; c.lineWidth = 2; c.strokeRect(1,1,w-2,h-2);
    this.barSprite.material.map = new THREE.CanvasTexture(c);
    this.barSprite.material.needsUpdate = true;
    this.barSprite.visible = this.alive && pct < 1;
  }

  distanceTo(o){ const dx=this.pos.x-o.pos.x, dz=this.pos.z-o.pos.z; return Math.hypot(dx,dz); }

  findNearestEnemy(maxDist){
    let best=null, bd=maxDist;
    for (const u of allUnits){
      if (!u.alive || u.team===this.team) continue;
      const d = this.distanceTo(u);
      // prefer creeps/heroes over buildings
      const weight = (u.type==='tower'||u.type==='ancient') ? 1.3 : 1.0;
      if (d*weight < bd){ bd=d*weight; best=u; }
    }
    return best;
  }

  moveToward(target, dt){
    const dx=target.x-this.pos.x, dz=target.z-this.pos.z;
    const d=Math.hypot(dx,dz);
    if (d<0.15) return true;
    const step=Math.min(this.speed*dt, d);
    this.pos.x += (dx/d)*step;
    this.pos.z += (dz/d)*step;
    this.mesh.rotation.y = Math.atan2(dx,dz);
    return false;
  }

  update(dt){
    if (!this.alive) return;
    if (this._ring) this._ring.rotation.z += dt*0.6;
    this.atkCd = Math.max(0, this.atkCd - dt);
    if (this.stunTimer>0){ this.stunTimer -= dt; this.mesh.position.copy(this.pos); return; }

    if (this.type==='creep' || this.type==='creep_ranged'){
      // chase enemy in range
      if (this.target && (!this.target.alive || this.distanceTo(this.target) > this.range+3)) this.target=null;
      if (!this.target) this.target = this.findNearestEnemy(this.range+4);
      if (this.target && this.distanceTo(this.target) <= this.range+0.6){
        if (this.atkCd<=0){ this.atkCd=1/this.atkSpeed; spawnProjectile(this, this.target, this.dmg); }
      } else {
        // follow lane
        this.laneProgress = Math.min(1, (this.laneProgress||0) + dt*this.speed/220);
        const t = this.laneTeam===TEAM.RADIANT ? this.laneProgress : 1-this.laneProgress;
        const p = sampleLane(this.lane, t);
        const dx=p.x-this.pos.x, dz=p.z-this.pos.z;
        const d=Math.hypot(dx,dz);
        if (d>0.2){
          const step = Math.min(this.speed*dt, d);
          this.pos.x += dx/d*step; this.pos.z += dz/d*step;
          this.mesh.rotation.y = Math.atan2(dx,dz);
        }
      }
    } else if (this.type==='tower' || this.type==='ancient'){
      if (this.type==='tower'){
        if (this.target && (!this.target.alive || this.distanceTo(this.target) > this.range+1)) this.target=null;
        if (!this.target) this.target = this.findNearestEnemy(this.range);
        if (this.target && this.distanceTo(this.target) <= this.range){
          if (this.atkCd<=0){ this.atkCd=1/this.atkSpeed; spawnProjectile(this, this.target, this.dmg); }
        }
      }
    }

    this.mesh.position.copy(this.pos);
    this.drawBar();
  }

  takeDamage(amount, source){
    if (!this.alive) return;
    this.hp -= amount;
    // tiny flinch
    this.mesh.position.x += (Math.random()-0.5)*0.1;
    this.mesh.position.z += (Math.random()-0.5)*0.1;
    if (this.hp <= 0){ this.hp = 0; this.die(source); }
  }

  die(source){
    this.alive = false;
    this.mesh.visible = false;
    this.barSprite.visible = false;
    if (source && source.type==='hero'){
      const gold = { hero:250, creep:35, creep_ranged:50, tower:300, ancient:0 }[this.type] || 0;
      const xp   = { hero:120, creep:35, creep_ranged:45, tower:220, ancient:0 }[this.type] || 0;
      source.gold += gold;
      source.addXp(xp);
    }
    if (this.isAncient){
      endGame(source ? source.team : -1);
    }
  }
}

/* ============================================================
   PROJECTILES
============================================================ */
function spawnProjectile(from, to, dmg, big=false){
  const geo = big
    ? new THREE.SphereGeometry(0.5, 12, 12)
    : new THREE.SphereGeometry(0.22, 8, 8);
  const col = from.team === TEAM.RADIANT ? 0x7dffb0 : 0xff8080;
  const mat = new THREE.MeshBasicMaterial({ color: big ? 0xffaa33 : col });
  const m = new THREE.Mesh(geo, mat);
  const startY = from.type==='hero'?1.9 : from.type==='tower'?5.5 : 0.8;
  m.position.copy(from.pos); m.position.y = startY;
  scene.add(m);
  const light = new THREE.PointLight(mat.color, 1.4, big?10:6);
  m.add(light);
  projectiles.push({ mesh:m, from, to, dmg, speed: big?34:28 });
}

function updateProjectiles(dt){
  for (let i=projectiles.length-1; i>=0; i--){
    const p = projectiles[i];
    if (!p.to.alive){ scene.remove(p.mesh); projectiles.splice(i,1); continue; }
    const tp = p.to.pos.clone();
    tp.y = p.to.type==='hero'?1.9 : p.to.type==='tower'?4.5 : p.to.type==='ancient'?3.5 : 0.8;
    const dir = tp.clone().sub(p.mesh.position);
    const d = dir.length();
    if (d < 0.6){
      p.to.takeDamage(p.dmg, p.from);
      // hit spark
      const spark = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 8, 8),
        new THREE.MeshBasicMaterial({ color: p.mesh.material.color, transparent:true, opacity:0.9 })
      );
      spark.position.copy(tp); scene.add(spark);
      let t=0;
      const anim = ()=>{ t+=0.08; spark.scale.setScalar(1+t*3); spark.material.opacity=0.9-t;
        if (t<0.9) requestAnimationFrame(anim); else scene.remove(spark); };
      anim();
      scene.remove(p.mesh); projectiles.splice(i,1); continue;
    }
    dir.normalize();
    p.mesh.position.addScaledVector(dir, p.speed*dt);
  }
}

/* ============================================================
   HERO
============================================================ */
class Hero extends Unit {
  constructor(opts){
    super({ ...opts, type:'hero' });
    this.level = 1; this.xp = 0; this.xpToNext = 200;
    this.gold = 600;
    this.attrPoints = 1; this.skillPoints = 1;

    this.baseStr = opts.baseStr ?? 22;
    this.baseAgi = opts.baseAgi ?? 20;
    this.baseInt = opts.baseInt ?? 18;
    this.gainStr = opts.gainStr ?? 3.0;
    this.gainAgi = opts.gainAgi ?? 2.2;
    this.gainInt = opts.gainInt ?? 1.8;
    this.mainAttr = opts.mainAttr ?? 'AGI';
    this.bonusStr = this.bonusAgi = this.bonusInt = 0;

    this.abilities = {
      Q: { name:'Fireball', cd:0, maxCd:6,  level:0, maxLevel:4, mana:60,  range:9,  dmg:[80,140,200,280] },
      W: { name:'Blast',    cd:0, maxCd:10, level:0, maxLevel:4, mana:80,  range:4,  dmg:[100,170,250,340] },
      E: { name:'Dash',     cd:0, maxCd:12, level:0, maxLevel:4, mana:40,  range:8 },
      R: { name:'Meteor',   cd:0, maxCd:55, level:0, maxLevel:3, mana:200, range:11, dmg:[350,520,720], ulti:true },
    };

    this.recalcStats();
    this.hp = this.maxHp; this.mana = this.maxMana;
    this.attackRange = 2.6;
    this.range = this.attackRange;
    this._respawnTimer = 0;
  }

  recalcStats(){
    const l = this.level - 1;
    this.str = this.baseStr + this.gainStr*l + this.bonusStr;
    this.agi = this.baseAgi + this.gainAgi*l + this.bonusAgi;
    this.int = this.baseInt + this.gainInt*l + this.bonusInt;

    this.maxHp    = 200 + this.str * 20;
    this.hpRegen  = 0.6 + this.str * 0.1;
    this.maxMana  = 80 + this.int * 12;
    this.manaRegen= 0.4 + this.int * 0.06;
    this.armor    = 1 + this.agi * 0.16;
    const main = this.mainAttr==='STR'?this.str : this.mainAttr==='AGI'?this.agi : this.int;
    this.dmg      = 30 + main * 1.2;
    this.atkSpeed = 0.9 + this.agi * 0.012;
    this.speed    = 6 + this.agi * 0.006;
  }

  addXp(n){
    if (this.level>=CONFIG.MAX_LVL) return;
    this.xp += n;
    while (this.xp >= this.xpToNext && this.level < CONFIG.MAX_LVL){
      this.xp -= this.xpToNext; this.level++;
      this.xpToNext = 200 + this.level*100;
      this.attrPoints++; this.skillPoints++;
      this.recalcStats();
      this.hp = this.maxHp; this.mana = this.maxMana;
      // level-up flash
      const flash = new THREE.Mesh(
        new THREE.RingGeometry(0.5, 2.2, 24),
        new THREE.MeshBasicMaterial({ color:0xffd966, transparent:true, opacity:0.9, side:THREE.DoubleSide })
      );
      flash.rotation.x = -Math.PI/2; flash.position.copy(this.pos); flash.position.y=0.2;
      scene.add(flash);
      let t=0;
      const anim = ()=>{ t+=0.05; flash.scale.setScalar(1+t*2); flash.material.opacity=0.9-t;
        if (t<0.9) requestAnimationFrame(anim); else scene.remove(flash); };
      anim();
    }
  }

  addAttr(kind){
    if (this.attrPoints<=0) return;
    if (kind==='STR') this.bonusStr++;
    else if (kind==='AGI') this.bonusAgi++;
    else if (kind==='INT') this.bonusInt++;
    this.attrPoints--;
    this.recalcStats();
  }

  levelAbility(key){
    const a = this.abilities[key];
    if (!a || a.level >= a.maxLevel || this.skillPoints<=0) return false;
    if (a.ulti){
      const req = [6,12,18][a.level];
      if (this.level < req) return false;
    }
    a.level++; this.skillPoints--; return true;
  }

  update(dt){
    if (!this.alive){
      this._respawnTimer -= dt;
      if (this._respawnTimer <= 0){
        this.alive = true;
        this.hp = this.maxHp; this.mana = this.maxMana;
        this.pos.copy(this.team===TEAM.RADIANT ? RADIANT_BASE : DIRE_BASE);
        this.pos.x += (Math.random()-0.5)*3;
        this.pos.z += (Math.random()-0.5)*3;
        this.mesh.visible = true;
      }
      return;
    }
    this.recalcStats();
    this.hp = Math.min(this.maxHp, this.hp + this.hpRegen*dt);
    this.mana = Math.min(this.maxMana, this.mana + this.manaRegen*dt);
    this.gold += 1.6 * dt;

    for (const k in this.abilities){
      const a = this.abilities[k];
      if (a.cd>0) a.cd = Math.max(0, a.cd - dt);
    }
    this.atkCd = Math.max(0, this.atkCd - dt);
    if (this.stunTimer>0){ this.stunTimer -= dt; this.mesh.position.copy(this.pos); this.drawBar(); return; }

    let usedKeyboardMove = false;
    if (!this.moveTarget){
      const x = (keys['KeyD']?1:0) - (keys['KeyA']?1:0);
      const z = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
      if (x||z){
        const len = Math.hypot(x,z);
        this.pos.x += x/len*this.speed*dt;
        this.pos.z += z/len*this.speed*dt;
        this.mesh.rotation.y = Math.atan2(x,z);
        usedKeyboardMove = true;
        this.target = null;
      }
    }
    if (this.moveTarget){
      const reached = this.moveToward(this.moveTarget, dt);
      if (reached || this.pos.distanceTo(this.moveTarget) < 0.4) this.moveTarget = null;
    }

    // auto-attack
    if (!this.moveTarget && !usedKeyboardMove){
      if (this.target && (!this.target.alive || this.distanceTo(this.target) > this.attackRange+3))
        this.target = null;
      if (!this.target) this.target = this.findNearestEnemy(this.attackRange+3);
      if (this.target && this.distanceTo(this.target) <= this.attackRange && this.atkCd<=0){
        this.atkCd = 1/this.atkSpeed;
        spawnProjectile(this, this.target, this.dmg);
      }
    }

    // clamp to map
    const lim = CONFIG.MAP/2 - 3;
    this.pos.x = Math.max(-lim, Math.min(lim, this.pos.x));
    this.pos.z = Math.max(-lim, Math.min(lim, this.pos.z));

    this.mesh.position.copy(this.pos);
    this.drawBar();
  }

  die(source){
    super.die(source);
    this._respawnTimer = 5 + this.level * 0.4;
    this.moveTarget = null; this.target = null;
  }

  castAbility(key){
    const a = this.abilities[key];
    if (!a || a.level<=0 || a.cd>0 || this.mana < a.mana) return;

    let target = this.target && this.target.alive ? this.target : null;
    if (!target){
      let best=null, bd=a.range;
      for (const u of allUnits){
        if (!u.alive || u.team===this.team) continue;
        const d=this.distanceTo(u);
        if (d<bd){ bd=d; best=u; }
      }
      target = best;
    }

    if (key==='Q'){
      if (!target) return;
      this.mana -= a.mana; a.cd = a.maxCd;
      spawnProjectile(this, target, a.dmg[a.level-1], true);
    } else if (key==='W'){
      this.mana -= a.mana; a.cd = a.maxCd;
      for (const u of allUnits){
        if (!u.alive || u.team===this.team) continue;
        if (this.distanceTo(u) < a.range + u.size) u.takeDamage(a.dmg[a.level-1], this);
      }
      // ring VFX
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.5, a.range, 32),
        new THREE.MeshBasicMaterial({ color:0xffcc44, transparent:true, opacity:0.8, side:THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI/2; ring.position.copy(this.pos); ring.position.y = 0.4;
      scene.add(ring);
      let t=0;
      const anim = ()=>{ t+=0.06; ring.scale.setScalar(1 + t*1.6); ring.material.opacity = 0.8-t*1.4;
        if (t<0.6) requestAnimationFrame(anim); else scene.remove(ring); };
      anim();
    } else if (key==='E'){
      this.mana -= a.mana; a.cd = a.maxCd;
      const dir = new THREE.Vector3(Math.sin(this.mesh.rotation.y), 0, Math.cos(this.mesh.rotation.y));
      this.pos.addScaledVector(dir, 8);
      // dash trail
      const trail = new THREE.Mesh(
        new THREE.CylinderGeometry(0.7, 0.7, 6, 8),
        new THREE.MeshBasicMaterial({ color: 0x66ddff, transparent:true, opacity:0.6 })
      );
      trail.position.copy(this.pos).addScaledVector(dir, -3);
      trail.rotation.z = Math.PI/2;
      trail.lookAt(this.pos.clone().add(dir));
      scene.add(trail);
      let t=0;
      const anim = ()=>{ t+=0.06; trail.material.opacity = 0.6-t; if (t<0.6) requestAnimationFrame(anim); else scene.remove(trail); };
      anim();
    } else if (key==='R'){
      if (!target) return;
      this.mana -= a.mana; a.cd = a.maxCd;
      const targetPos = target.pos.clone();
      const warn = new THREE.Mesh(
        new THREE.RingGeometry(2.4, 3.2, 32),
        new THREE.MeshBasicMaterial({ color:0xff4422, transparent:true, opacity:0.8, side:THREE.DoubleSide })
      );
      warn.rotation.x = -Math.PI/2; warn.position.copy(targetPos); warn.position.y=0.2;
      scene.add(warn);
      let wt = 0;
      const warnAnim = ()=>{ wt+=0.04; warn.scale.setScalar(1 + Math.sin(wt*12)*0.06); warn.material.opacity=0.5+Math.sin(wt*12)*0.3;
        if (wt<1.5) requestAnimationFrame(warnAnim); else scene.remove(warn); };
      warnAnim();

      const heroRef = this;
      setTimeout(()=>{
        for (const u of allUnits){
          if (!u.alive || u.team===heroRef.team) continue;
          const dx = u.pos.x - targetPos.x, dz = u.pos.z - targetPos.z;
          if (dx*dx + dz*dz < 9) u.takeDamage(a.dmg[a.level-1], heroRef);
        }
        const boom = new THREE.Mesh(
          new THREE.SphereGeometry(3, 16, 16),
          new THREE.MeshBasicMaterial({ color:0xff7722, transparent:true, opacity:0.9 })
        );
        boom.position.copy(targetPos); boom.position.y = 1.5;
        scene.add(boom);
        const light = new THREE.PointLight(0xff8833, 5, 25);
        light.position.copy(targetPos); light.position.y = 3;
        scene.add(light);
        let t=0;
        const anim = ()=>{ t+=0.05; boom.scale.setScalar(1+t*2); boom.material.opacity=0.9-t;
          light.intensity = 5*(1-t);
          if (t<1) requestAnimationFrame(anim); else { scene.remove(boom); scene.remove(light); } };
        anim();
      }, 1500);
    }
  }
}

const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const tmpPt = new THREE.Vector3();

renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());
renderer.domElement.addEventListener('pointerdown', e=>{
  if (e.button !== 2) return;
  mouseNDC.x = (e.clientX / innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  if (!raycaster.ray.intersectPlane(groundPlane, tmpPt)) return;

  // prioritize enemy unit click
  let clicked = null, cd = 4.5;
  for (const u of allUnits){
    if (!u.alive || u.team===playerHero.team) continue;
    const dx = u.pos.x - tmpPt.x, dz = u.pos.z - tmpPt.z;
    const d = Math.hypot(dx,dz);
    if (d < cd){ cd=d; clicked=u; }
  }
  if (clicked){
    playerHero.target = clicked;
    playerHero.moveTarget = clicked.pos.clone();
  } else {
    playerHero.moveTarget = tmpPt.clone();
    playerHero.target = null;

/* ============================================================
   SIMPLE ENEMY HERO AI
============================================================ */
function updateEnemyAI(dt){
  const h = enemyHero;
  if (!h.alive) return;

  // spend skill points
  if (h.skillPoints > 0){
    for (const k of ['Q','W','E','R']) if (h.levelAbility(k)) break;
  }
  if (h.attrPoints > 0) h.addAttr(h.mainAttr);

  // find nearest player-visible enemy for abilities
  if (h.atkCd <= 0){
    let best=null, bd=9;
    for (const u of allUnits){
      if (!u.alive || u.team===h.team) continue;
      const d = h.distanceTo(u);
      if (d<bd){ bd=d; best=u; }
    }
    if (best){
      h.target = best;
      h.castAbility('Q');
      if (h.distanceTo(best) < 3.5) h.castAbility('W');
    }
  }

  // move along mid lane if no target
  if (!h.target || !h.target.alive){
    h.aiProgress = (h.aiProgress || 0.9) - dt*0.008;
    if (h.aiProgress < 0.05) h.aiProgress = 0.95;
    const p = sampleLane('mid', h.aiProgress);
    const dx = p.x-h.pos.x, dz = p.z-h.pos.z;
    const d = Math.hypot(dx,dz);
    if (d>0.5){
      const step = Math.min(h.speed*dt*0.9, d);
      h.pos.x += dx/d*step; h.pos.z += dz/d*step;
      h.mesh.rotation.y = Math.atan2(dx,dz);
    }
    h.mesh.position.copy(h.pos);
    h.drawBar();
  }
}

/* ============================================================
   GAME LOOP
============================================================ */
let last = performance.now();
let hudAccum = 0;
let kills = { radiant:0, dire:0 };

function loop(){
  const now = performance.now();
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;

  if (!gameEnded){
    gameTime += dt;
    timerEl.textContent = `${String(Math.floor(gameTime/60)).padStart(2,'0')}:${String(Math.floor(gameTime%60)).padStart(2,'0')}`;

    // creep waves
    creepTimer += dt;
    if (creepTimer >= CONFIG.CREEP_INT){ creepTimer = 0; spawnWave(); }

    // update all units
    for (const u of allUnits) u.update(dt);
    updateProjectiles(dt);
    updateEnemyAI(dt);
  }

  updateCamera(dt);

  // HUD
  hudAccum += dt;
  if (hudAccum > 0.1){ hudAccum = 0; updateHUD(); }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

updateHUD();
loop();

/* ============================================================
   ROTATE OVERLAY (mobile hint)
============================================================ */
async function tryLockLandscape(){
  try { await (screen.orientation?.lock?.('landscape')); } catch(_) {}
}
window.addEventListener('touchend', ()=>{
  const el = document.documentElement;
  (el.requestFullscreen?.() ?? el.webkitRequestFullscreen?.() ?? Promise.resolve())
    ?.then?.(tryLockLandscape).catch(()=>{});
}, { once:true });

</script>
