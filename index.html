<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050510">
<title>Симбиот · Symbiot</title>
<style>
:root{--bg:#050510;--fg:#e8e8ff;--accent:#4ff;--accent2:#f4f;--dim:rgba(255,255,255,.6);--gold:#ffe24a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;}
#game{display:block;position:fixed;inset:0;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:10;padding:max(env(safe-area-inset-top),16px) max(env(safe-area-inset-right),16px)
  max(env(safe-area-inset-bottom),16px) max(env(safe-area-inset-left),16px);}
.screen.active{display:flex;}
.screen::before{content:'';position:absolute;inset:0;z-index:-1;
  background:radial-gradient(ellipse at 30% 20%,rgba(80,40,180,.25),transparent 60%),
             radial-gradient(ellipse at 70% 80%,rgba(40,180,200,.2),transparent 60%),rgba(5,5,16,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.title{font-size:clamp(2rem,9vw,4.5rem);letter-spacing:.35em;padding-left:.35em;
  background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;
  background-clip:text;color:transparent;font-weight:200;text-transform:uppercase;margin-bottom:.4em;
  filter:drop-shadow(0 0 30px rgba(80,220,255,.35));}
.subtitle{color:var(--dim);font-size:.85rem;letter-spacing:.5em;text-transform:uppercase;margin-bottom:2em;padding-left:.5em;}
.btn{display:block;background:rgba(255,255,255,.03);color:var(--fg);border:1px solid rgba(255,255,255,.15);
  padding:.9em 2.2em;margin:.35em;font-size:clamp(.85rem,2.5vw,1rem);letter-spacing:.2em;
  text-transform:uppercase;cursor:pointer;transition:all .2s;border-radius:2px;
  min-width:min(280px,70vw);font-family:inherit;font-weight:400;}
.btn:hover,.btn:focus{border-color:var(--accent);color:var(--accent);
  box-shadow:0 0 24px rgba(64,255,255,.3),inset 0 0 24px rgba(64,255,255,.08);outline:none;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.primary{border-color:var(--accent);color:var(--accent);}
.btn.small{min-width:auto;padding:.6em 1.2em;font-size:.75rem;}
.panel{background:rgba(10,10,30,.7);border:1px solid rgba(255,255,255,.1);border-radius:8px;
  padding:1.5em;max-width:min(500px,92vw);width:100%;max-height:80vh;overflow-y:auto;}
.panel h2{font-weight:300;letter-spacing:.2em;text-transform:uppercase;margin-bottom:1em;font-size:1.1rem;color:var(--accent);}
.field{display:flex;justify-content:space-between;align-items:center;padding:.6em 0;border-bottom:1px solid rgba(255,255,255,.06);}
.field:last-child{border-bottom:none;}
.field label{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
.field input[type=range]{width:140px;accent-color:var(--accent);}
.field select{background:rgba(255,255,255,.05);color:var(--fg);border:1px solid rgba(255,255,255,.15);
  padding:.3em .6em;border-radius:2px;font-family:inherit;font-size:.85rem;}
.field input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--accent);}
.levels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.55em;
  max-height:58vh;overflow-y:auto;padding:.5em;width:100%;max-width:min(820px,92vw);}
.lvl-card{aspect-ratio:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);
  border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;font-size:.75rem;padding:.3em;text-align:center;position:relative;}
.lvl-card:hover{border-color:var(--accent);background:rgba(64,255,255,.06);}
.lvl-card.locked{opacity:.45;cursor:not-allowed;background:rgba(20,10,40,.5);}
.lvl-card.done{border-color:rgba(64,255,255,.4);}
.lvl-card.boss{border-color:rgba(255,80,80,.6);background:rgba(40,10,20,.5);}
.lvl-card.boss .num{color:#f66;}
.lvl-card .num{font-size:1.35rem;font-weight:200;color:var(--accent);}
.lvl-card.locked .num{color:rgba(200,120,255,.6);}
.lvl-card .nm{font-size:.55rem;color:var(--dim);margin-top:.2em;line-height:1.2;}
.lvl-card .cores{position:absolute;bottom:.3em;font-size:.55rem;color:var(--gold);letter-spacing:.15em;}
.lvl-card .lockicon{position:absolute;top:.3em;right:.4em;font-size:.75rem;color:rgba(200,120,255,.85);}
.lang-picker{display:flex;gap:1em;margin-top:.5em;justify-content:center;}
#toast{position:fixed;top:1em;left:50%;transform:translateX(-50%);background:rgba(10,10,30,.9);
  border:1px solid var(--accent);color:var(--accent);padding:.6em 1.2em;border-radius:4px;
  font-size:.85rem;letter-spacing:.15em;text-transform:uppercase;opacity:0;transition:opacity .3s;
  z-index:100;pointer-events:none;max-width:90vw;text-align:center;}
#toast.show{opacity:1;}
#tutorial{position:fixed;bottom:max(200px,calc(env(safe-area-inset-bottom,0px) + 180px));
  left:50%;transform:translateX(-50%);background:rgba(10,10,30,.94);
  border:1px solid rgba(80,220,255,.55);color:#e8e8ff;padding:.9em 1.5em;border-radius:10px;
  font-size:clamp(.8rem,2.4vw,1rem);letter-spacing:.06em;max-width:min(560px,90vw);text-align:center;
  pointer-events:none;opacity:0;transition:opacity .45s;z-index:8;
  box-shadow:0 0 34px rgba(80,220,255,.35),inset 0 0 20px rgba(80,220,255,.08);line-height:1.5;}
#tutorial.show{opacity:1;}
#tutorial::before{content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:8px;height:8px;border-radius:50%;background:#4ff;box-shadow:0 0 12px #4ff;animation:pulse 1.6s infinite;}
#tutorial::after{content:'';position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:8px;height:8px;border-radius:50%;background:#4ff;box-shadow:0 0 12px #4ff;animation:pulse 1.6s infinite .8s;}
@keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}
.game-hud{position:fixed;inset:0;pointer-events:none;z-index:5;}
.game-hud .top{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:max(env(safe-area-inset-top),12px) max(env(safe-area-inset-right),16px) 0 max(env(safe-area-inset-left),16px);}
.game-hud .top .lvl,.game-hud .top .cores{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;
  background:rgba(0,0,0,.4);padding:.4em .8em;border-radius:3px;color:var(--dim);}
.game-hud .top .cores{color:var(--gold);font-weight:500;}
.game-hud .top .btns{pointer-events:auto;display:flex;gap:.4em;}
.game-hud .top .btns button{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);
  color:var(--fg);width:38px;height:38px;border-radius:50%;font-size:.9rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;}
.game-hud .top .btns button:hover{border-color:var(--accent);color:var(--accent);}
#hookBtn{position:fixed;bottom:max(110px,calc(env(safe-area-inset-bottom,22px) + 90px));
  left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,240,150,.25),rgba(255,220,80,.12));
  border:2px solid rgba(255,220,80,.75);color:var(--gold);cursor:pointer;z-index:6;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,background .15s,box-shadow .15s;
  pointer-events:auto;font-family:inherit;padding:0;
  box-shadow:0 0 20px rgba(255,220,80,.25),inset 0 0 14px rgba(255,220,80,.15);}
#hookBtn svg{display:block;filter:drop-shadow(0 0 6px rgba(255,220,80,.7));}
#hookBtn:active{background:radial-gradient(circle at 30% 30%,rgba(255,240,150,.5),rgba(255,220,80,.3));
  transform:translateX(-50%) scale(.9);}
#hookBtn.cooldown{opacity:.4;pointer-events:none;}
@media (max-height:500px){
  #hookBtn{top:60px;right:16px;bottom:auto;left:auto;transform:none;width:56px;height:56px;}
  #hookBtn:active{transform:scale(.9);}}
@media (hover:hover) and (pointer:fine){#hookBtn{display:none!important;}}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.7em;
  max-height:58vh;overflow-y:auto;padding:.5em;width:100%;max-width:min(720px,92vw);}
.shop-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:8px;
  padding:.9em;display:flex;flex-direction:column;align-items:center;gap:.4em;cursor:pointer;transition:all .2s;position:relative;}
.shop-item:hover{border-color:var(--accent);background:rgba(64,255,255,.06);}
.shop-item.owned{border-color:rgba(80,255,140,.5);}
.shop-item.equipped{border-color:var(--gold);background:rgba(255,220,80,.08);}
.shop-item .preview{width:64px;height:64px;display:flex;align-items:center;justify-content:center;}
.shop-item .sn{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg);text-align:center;}
.shop-item .sp{font-size:.75rem;color:var(--gold);letter-spacing:.1em;}
.shop-item .sl{position:absolute;top:.3em;right:.5em;font-size:.6rem;color:var(--dim);letter-spacing:.1em;}
.hidden{display:none!important;}
@media (max-width:520px){.title{font-size:2rem;letter-spacing:.2em;padding-left:.2em;}.panel{padding:1em;}
  .shop-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="screen active" id="s-menu">
  <h1 class="title">Симбиот</h1>
  <div class="subtitle" data-i18n="subtitle">две души · одна нить</div>
  <button class="btn primary hidden" id="btnContinue" data-action="continue" data-i18n="continue">Продолжить</button>
  <button class="btn" data-action="newgame" data-i18n="newGame">Новая игра</button>
  <button class="btn" data-action="levels" data-i18n="levels">Уровни</button>
  <button class="btn" data-action="shop" data-i18n="shop">Магазин скинов</button>
  <button class="btn" data-action="settings" data-i18n="settings">Настройки</button>
  <button class="btn" data-action="lang" data-i18n="language">Язык</button>
</div>
<div class="screen" id="s-levels">
  <h2 class="title" style="font-size:clamp(1.2rem,4vw,1.8rem);margin-bottom:.4em;" data-i18n="levels">Уровни</h2>
  <div id="coresTotal" style="color:var(--gold);font-size:.9rem;letter-spacing:.2em;margin-bottom:.6em;">◆ 0 / 120</div>
  <div class="levels-grid" id="levelsGrid"></div>
  <button class="btn" data-action="back-menu" style="margin-top:1em;" data-i18n="back">Назад</button>
</div>
<div class="screen" id="s-shop">
  <h2 class="title" style="font-size:clamp(1.2rem,4vw,1.8rem);margin-bottom:.4em;" data-i18n="shop">Магазин</h2>
  <div id="shopTotal" style="color:var(--gold);font-size:.9rem;letter-spacing:.2em;margin-bottom:.6em;">◆ 0</div>
  <div class="shop-grid" id="shopGrid"></div>
  <button class="btn" data-action="back-menu" style="margin-top:1em;" data-i18n="back">Назад</button>
</div>
<div class="screen" id="s-settings">
  <div class="panel">
    <h2 data-i18n="settings">Настройки</h2>
    <div class="field"><label data-i18n="music">Музыка</label><input type="range" id="set-music" min="0" max="1" step="0.05"></div>
    <div class="field"><label data-i18n="sfx">Звук</label><input type="range" id="set-sfx" min="0" max="1" step="0.05"></div>
    <div class="field"><label data-i18n="quality">Качество</label>
      <select id="set-quality"><option value="low">Низкое</option><option value="medium">Среднее</option><option value="high">Высокое</option></select>
    </div>
    <div class="field"><label data-i18n="shake">Тряска экрана</label><input type="checkbox" id="set-shake"></div>
    <div class="field"><label data-i18n="deadzone">Мёртвая зона</label><input type="range" id="set-deadzone" min="0" max="0.4" step="0.05"></div>
    <div class="field"><label data-i18n="reset">Сбросить прогресс</label><button class="btn small" data-action="reset">Reset</button></div>
  </div>
  <button class="btn" data-action="back-menu" style="margin-top:1em;" data-i18n="back">Назад</button>
</div>
<div class="screen" id="s-lang">
  <div class="panel" style="text-align:center;">
    <h2 data-i18n="language">Язык</h2>
    <div class="lang-picker"><button class="btn" data-lang="ru">Русский</button><button class="btn" data-lang="en">English</button></div>
  </div>
  <button class="btn" data-action="back-menu" style="margin-top:1em;" data-i18n="back">Назад</button>
</div>
<div class="screen" id="s-pause">
  <h2 class="title" style="font-size:clamp(1.5rem,5vw,2.5rem);" data-i18n="pause">Пауза</h2>
  <button class="btn primary" data-action="resume" data-i18n="resume">Продолжить</button>
  <button class="btn" data-action="restart" data-i18n="restart">Заново</button>
  <button class="btn" data-action="levels-pause" data-i18n="levels">Уровни</button>
  <button class="btn" data-action="settings-pause" data-i18n="settings">Настройки</button>
  <button class="btn" data-action="menu-pause" data-i18n="menu">Меню</button>
</div>
<div class="screen" id="s-complete">
  <h2 class="title" style="font-size:clamp(1.5rem,5vw,2.5rem);" data-i18n="complete">Уровень пройден!</h2>
  <div class="panel" style="text-align:center;max-width:380px;"><div id="completeStats" style="letter-spacing:.15em;line-height:2;"></div></div>
  <button class="btn primary" data-action="next" data-i18n="next">Далее</button>
  <button class="btn" data-action="restart-complete" data-i18n="retry">Заново</button>
  <button class="btn" data-action="levels-complete" data-i18n="levels">Уровни</button>
</div>
<div class="game-hud hidden" id="hud">
  <div class="top">
    <div class="lvl" id="hudLevel">Уровень 1</div>
    <div class="btns"><button id="btnPause">II</button></div>
    <div class="cores" id="hudCores">0 / 3</div>
  </div>
</div>
<div id="tutorial"><span id="tutorialText"></span></div>
<button id="hookBtn" class="hidden" aria-label="Hook">
  <svg viewBox="0 0 40 40" width="34" height="34" fill="none"
       stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="7" r="3.2" fill="currentColor" stroke="none"/>
    <path d="M20 10.5 L20 25"/>
    <path d="M20 25 a6.5 6.5 0 1 0 6.5 6.5"/>
  </svg>
</button>
<div id="toast"></div>

const Audio={
  ctx:null,master:null,musicGain:null,sfxGain:null,revGain:null,droneNodes:[],conv:null,
  init(){if(this.ctx)return;
    try{const AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC();
      this.master=this.ctx.createGain();this.master.gain.value=1;this.master.connect(this.ctx.destination);
      this.conv=this.ctx.createConvolver();this.conv.buffer=this._makeIR(2.2,2.6);
      this.revGain=this.ctx.createGain();this.revGain.gain.value=.25;
      this.revGain.connect(this.conv);this.conv.connect(this.master);
      this.musicGain=this.ctx.createGain();this.musicGain.gain.value=SAVE.settings.music*.5;
      this.musicGain.connect(this.master);this.musicGain.connect(this.revGain);
      this.sfxGain=this.ctx.createGain();this.sfxGain.gain.value=SAVE.settings.sfx*.7;
      this.sfxGain.connect(this.master);this.sfxGain.connect(this.revGain);
    }catch(e){}},
  _makeIR(sec,decay){const rate=this.ctx.sampleRate,len=Math.floor(rate*sec);
    const buf=this.ctx.createBuffer(2,len,rate);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
    return buf;},
  resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  sfx(type){if(!this.ctx||SAVE.settings.sfx<=0)return;
    const c=this.ctx,now=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(this.sfxGain);
    let f0=440,f1=220,dur=.15,wave='sine';
    switch(type){
      case 'click':f0=600;f1=900;dur=.06;break;
      case 'jump':f0=300;f1=600;dur=.12;wave='triangle';break;
      case 'core':f0=880;f1=1760;dur=.32;break;
      case 'die':f0=400;f1=60;dur=.6;wave='sawtooth';break;
      case 'win':f0=523;f1=1046;dur=.6;break;
      case 'door':f0=200;f1=500;dur=.3;wave='square';break;
      case 'anchor':f0=1200;f1=400;dur=.2;wave='triangle';break;
      case 'hook_fly':f0=1800;f1=800;dur=.18;wave='triangle';break;
      case 'hook_grab':f0=400;f1=1400;dur=.15;wave='square';break;
      case 'hook_release':f0=1000;f1=200;dur=.22;wave='sine';break;
      case 'hit':f0=200;f1=80;dur=.15;wave='sawtooth';break;
      case 'laser':f0=1400;f1=300;dur=.25;wave='square';break;
      case 'shoot':f0=800;f1=200;dur=.15;wave='square';break;
      case 'locked':f0=200;f1=100;dur=.2;wave='square';break;
      case 'anchor_far':f0=180;f1=90;dur=.18;wave='sine';break;
      case 'hook_blocked':f0=120;f1=60;dur=.28;wave='sawtooth';break;
      case 'buy':f0=660;f1=1320;dur=.35;break;
    }
    o.type=wave;o.frequency.setValueAtTime(f0,now);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),now+dur);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(.4,now+.01);
    g.gain.exponentialRampToValueAtTime(.0001,now+dur);
    o.start(now);o.stop(now+dur+.05);},
  startDrone(){this.init();if(!this.ctx||this.droneNodes.length)return;
    const c=this.ctx;[55,82.4,110,164.8].forEach((f,i)=>{
      const o=c.createOscillator();o.type=i%2?'triangle':'sine';o.frequency.value=f;
      const g=c.createGain();g.gain.value=.06;o.connect(g);g.connect(this.musicGain);o.start();
      this.droneNodes.push({o,g,base:f});});},
  stopDrone(){this.droneNodes.forEach(n=>{try{n.o.stop();}catch(e){}});this.droneNodes=[];},
  setTension(v){if(!this.ctx) return;const now=this.ctx.currentTime;
    this.droneNodes.forEach(n=>{try{n.o.frequency.setTargetAtTime(n.base*(1+v*.18),now,0.05);}catch(e){}});},
  duckMusic(){if(this.musicGain)this.musicGain.gain.value=SAVE.settings.music*.15;},
  unduckMusic(){if(this.musicGain)this.musicGain.gain.value=SAVE.settings.music*.5;}
};

class Rope{
  constructor(a,b,maxLen,segs){
    this.a=a;this.b=b;this.maxLen=maxLen;this.segs=segs;
    this.rest=maxLen/segs;this.baseRest=this.rest;
    this.points=[];this.attached=[];
    for(let i=0;i<=segs;i++){
      const t=i/segs,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;
      this.points.push({x,y,px:x,py:y});
    }
  }
  reset(){
    const {a,b,segs}=this;
    for(let i=0;i<=segs;i++){
      const t=i/segs,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;
      const p=this.points[i];p.x=x;p.y=y;p.px=x;p.py=y;
    }
    this.attached=[];
  }
  releaseAll(){this.attached=[];}
  update(dt,gravity){
    const pts=this.points,last=pts.length-1,damping=0.985,g=gravity*0.5,dt2=dt*dt;
    for(let i=1;i<last;i++){
      const p=pts[i];
      const vx=(p.x-p.px)*damping,vy=(p.y-p.py)*damping;
      p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+g*dt2;
    }
    pts[0].x=this.a.x;pts[0].y=this.a.y;
    pts[last].x=this.b.x;pts[last].y=this.b.y;
    for(let iter=0;iter<5;iter++){
      for(let i=0;i<last;i++){
        const p1=pts[i],p2=pts[i+1];
        const dx=p2.x-p1.x,dy=p2.y-p1.y;
        const d=Math.hypot(dx,dy)||0.0001;
        const diff=(d-this.rest)/d;
        const mx=dx*diff*0.5,my=dy*diff*0.5;
        if(i!==0){p1.x+=mx;p1.y+=my;}
        if(i+1!==last){p2.x-=mx;p2.y-=my;}
      }
      pts[0].x=this.a.x;pts[0].y=this.a.y;
      pts[last].x=this.b.x;pts[last].y=this.b.y;
      for(const att of this.attached){
        const p=pts[att.seg];
        p.x=att.anchor.x;p.y=att.anchor.y;
        p.px=att.anchor.x;p.py=att.anchor.y;
      }
    }
    for(const p of pts){if(!isFinite(p.x)||!isFinite(p.y))this.reset();}
  }
}

function makeStick(stick){
  return {
    start(id,x,y){stick.active=true;stick.id=id;stick.ox=x;stick.oy=y;stick.dx=0;stick.dy=0;},
    move(id,x,y){if(!stick.active||stick.id!==id)return;
      let dx=x-stick.ox,dy=y-stick.oy;
      const d=Math.hypot(dx,dy),R=70,dz=SAVE.settings.deadzone;
      if(d<R*dz){stick.dx=0;stick.dy=0;return;}
      const m=Math.min(1,(d-R*dz)/(R-R*dz));
      stick.dx=dx/d*m;stick.dy=dy/d*m;},
    end(id){if(stick.id===id){stick.active=false;stick.dx=0;stick.dy=0;stick.id=null;}}
  };
}

  Audio.resume(); if(G.state!=='playing')return;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  const {x,y}=getXY(e);
  if(x<canvas.clientWidth/2) lumHelper.start(pid(e),x,y);
  else noxHelper.start(pid(e),x,y);
});

  const {x,y}=getXY(e);

});

function readInput(){

  if(k['a']||k['ф'])lx-=1;if(k['d']||k['в'])lx+=1;
  if(k['w']||k['ц'])ly-=1;if(k['s']||k['ы'])ly+=1;
  if(k['arrowleft'])nx-=1;if(k['arrowright'])nx+=1;
  if(k['arrowup'])ny-=1;if(k['arrowdown'])ny+=1;
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  for(const gp of gps){if(!gp)continue;const ax=gp.axes;
    if(ax[0]&&Math.abs(ax[0])>0.15)lx+=ax[0];
    if(ax[1]&&Math.abs(ax[1])>0.15)ly+=ax[1];
    if(ax[2]&&Math.abs(ax[2])>0.15)nx+=ax[2];
    if(ax[3]&&Math.abs(ax[3])>0.15)ny+=ax[3];
    const btns=gp.buttons;
    if(btns&&btns.length>5){
      const l1=btns[4]&&btns[4].pressed,r1=btns[5]&&btns[5].pressed;
      if((l1&&!gpPrevButtons[4])||(r1&&!gpPrevButtons[5])){
        if(G.state==='playing')throwBothHooks();
      }
      gpPrevButtons[4]=l1;gpPrevButtons[5]=r1;
    }
    break;}
  if(Input.lumStick.active){lx+=Input.lumStick.dx;ly+=Input.lumStick.dy;}
  if(Input.noxStick.active){nx+=Input.noxStick.dx;ny+=Input.noxStick.dy;}
  const lm=Math.hypot(lx,ly);if(lm>1){lx/=lm;ly/=lm;}
  const nm=Math.hypot(nx,ny);if(nm>1){nx/=nm;ny/=nm;}
  return {lum:{x:lx,y:ly},nox:{x:nx,y:ny}};
}

function hasWallBetween(x1,y1,x2,y2){
  const dist=Math.hypot(x2-x1,y2-y1);
  const steps=Math.max(8,Math.ceil(dist/12));
  for(let i=1;i<steps;i++){
    const tt=i/steps;
    const x=lerp(x1,x2,tt),y=lerp(y1,y2,tt);
    for(const w of G.walls){
      if(x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h) return true;
    }
    for(const d of G.doors){
      if(!d.open && x>d.x&&x<d.x+d.w&&y>d.y&&y<d.y+d.h) return true;
    }
  }
  return false;
}
function throwBothHooks(){ throwHook(G.lum); throwHook(G.nox); }
function throwHook(c){
  if(!c||!c.alive||c.hook||c.hooked) return false;
  const other = c===G.lum ? G.nox : G.lum;
  let best=null,bestD=PHYS.HOOK_RANGE;
  for(const a of G.anchors){
    if(a.dead||a.cooldown>0) continue;
    if(G.rope.attached.some(x=>x.anchor===a)) continue;
    if(other && other.hook && other.hook.anchor===a) continue;
    if(other && other.hooked && other.hooked.anchor===a) continue;
    const d=Math.hypot(a.x-c.x,a.y-c.y);
    if(d<bestD){bestD=d;best=a;}
  }
  if(!best){ Audio.sfx('anchor_far'); return false; }
  if(hasWallBetween(c.x,c.y,best.x,best.y)){ Audio.sfx('hook_blocked'); return false; }
  c.hook={anchor:best,sx:c.x,sy:c.y,x:c.x,y:c.y,tx:best.x,ty:best.y,t:0};
  c.throwAnim=0.22;
  Audio.sfx('hook_fly');
  return true;
}
function updateHooks(dt){
  for(const c of [G.lum,G.nox]){
    if(!c||!c.hook) continue;
    c.hook.t += dt/PHYS.HOOK_TIME;
    const tt=Math.min(1,c.hook.t);
    c.hook.x=lerp(c.hook.sx,c.hook.tx,tt);
    c.hook.y=lerp(c.hook.sy,c.hook.ty,tt);
    if(tt>=1){
      const a=c.hook.anchor;
      c.hooked={anchor:a, timer:PHYS.HOOK_HOLD};
      let best=-1,bestD=Infinity;
      for(let i=1;i<G.rope.points.length-1;i++){
        const p=G.rope.points[i];
        const d=Math.hypot(p.x-a.x,p.y-a.y);
        if(d<bestD){bestD=d;best=i;}
      }
      if(!G.rope.attached.some(x=>x.anchor===a)){
        G.rope.attached.push({seg:best,anchor:a,lifeLeft:PHYS.HOOK_HOLD});
      }
      Audio.sfx('hook_grab');
      c.hook=null;
    }
  }
}

function computeCamera(){
  const L=G.level,W=canvas.clientWidth,H=canvas.clientHeight,pad=16;
  const sFit=Math.min((W-pad*2)/L.size[0],(H-pad*2)/L.size[1]);
  const MIN_VIEW=0.55;
  G.camera.W=W;G.camera.H=H;G.camera.pad=pad;
  if(sFit>=MIN_VIEW){
    G.camera.scale=sFit;G.camera.follow=false;
    G.camera.x=(W-L.size[0]*sFit)/2;
    G.camera.y=(H-L.size[1]*sFit)/2;
  } else {
    G.camera.scale=MIN_VIEW;G.camera.follow=true;
    const midX=(G.lum.x+G.nox.x)/2,midY=(G.lum.y+G.nox.y)/2;
    let tx=W/2-midX*MIN_VIEW,ty=H/2-midY*MIN_VIEW;
    const minX=W-L.size[0]*MIN_VIEW-pad,maxX=pad;
    const minY=H-L.size[1]*MIN_VIEW-pad,maxY=pad;
    const loX=Math.min(minX,maxX),hiX=Math.max(minX,maxX);
    const loY=Math.min(minY,maxY),hiY=Math.max(minY,maxY);
    tx=Math.max(loX,Math.min(hiX,tx));ty=Math.max(loY,Math.min(hiY,ty));
    G.camera.x=tx;G.camera.y=ty;
  }
}
function updateCameraFollow(){
  if(!G.camera.follow)return;
  const L=G.level,W=G.camera.W,H=G.camera.H,s=G.camera.scale,pad=G.camera.pad;
  const midX=(G.lum.x+G.nox.x)/2,midY=(G.lum.y+G.nox.y)/2;
  let tx=W/2-midX*s,ty=H/2-midY*s;
  const minX=W-L.size[0]*s-pad,maxX=pad;
  const minY=H-L.size[1]*s-pad,maxY=pad;
  const loX=Math.min(minX,maxX),hiX=Math.max(minX,maxX);
  const loY=Math.min(minY,maxY),hiY=Math.max(minY,maxY);
  tx=Math.max(loX,Math.min(hiX,tx));ty=Math.max(loY,Math.min(hiY,ty));
  G.camera.x=lerp(G.camera.x,tx,0.12);
  G.camera.y=lerp(G.camera.y,ty,0.12);
}

function rectCircleHit(cx,cy,r,rect){
  const nx=clamp(cx,rect.x,rect.x+rect.w),ny=clamp(cy,rect.y,rect.y+rect.h);
  const dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r;
}
function resolveCircleRect(c,r,rect){
  const nx=clamp(c.x,rect.x,rect.x+rect.w),ny=clamp(c.y,rect.y,rect.y+rect.h);
  const dx=c.x-nx,dy=c.y-ny;const d2=dx*dx+dy*dy;
  if(d2>=r*r)return;
  if(d2<0.0001){
    const left=c.x-rect.x,right=rect.x+rect.w-c.x;
    const top=c.y-rect.y,bot=rect.y+rect.h-c.y;
    const m=Math.min(left,right,top,bot);
    if(m===left){c.x=rect.x-r;c.vx=Math.min(0,c.vx);}
    else if(m===right){c.x=rect.x+rect.w+r;c.vx=Math.max(0,c.vx);}
    else if(m===top){c.y=rect.y-r;c.vy=Math.min(0,c.vy);c.onGround=true;}
    else{c.y=rect.y+rect.h+r;c.vy=Math.max(0,c.vy);}
    return;
  }
  const d=Math.sqrt(d2),nxv=dx/d,nyv=dy/d;
  const overlap=r-d;
  c.x+=nxv*overlap;c.y+=nyv*overlap;
  const vn=c.vx*nxv+c.vy*nyv;
  if(vn<0){c.vx-=vn*nxv;c.vy-=vn*nyv;}
  if(nyv<-0.5)c.onGround=true;
}

function updatePlatforms(dt){
  for(const p of G.platforms){
    const total=Math.hypot(p.bx-p.ax,p.by-p.ay);
    if(total<1) continue;
    const dur=Math.max(0.4,total/Math.max(30,p.speed));
    p.t+=dt/dur*p.dir;
    if(p.t>1){p.t=1;p.dir=-1;}
    if(p.t<0){p.t=0;p.dir=1;}
    const nx=lerp(p.ax,p.bx,p.t),ny=lerp(p.ay,p.by,p.t);
    p.prevX=p.x;p.prevY=p.y;
    p.x=nx;p.y=ny;
    const dx=p.x-p.prevX,dy=p.y-p.prevY;
    for(const c of [G.lum,G.nox]){
      if(!c||!c.alive)continue;
      if(c.x+c.r>p.x&&c.x-c.r<p.x+p.w&&c.y+c.r>p.y-6&&c.y+c.r<p.y+p.h+6&&Math.abs(c.y+c.r-p.y)<14){
        c.x+=dx;c.y+=dy;
      }
    }
  }
}
function updateLasers(dt){
  for(const l of G.lasers){
    const cycle=l.on+l.off;
    const phase=(G.t+l.delay)%cycle;
    l.active=phase<l.on;
    if(!l.active)continue;
    for(const c of [G.lum,G.nox]){
      if(!c.alive || c.invuln>0)continue;
      if(rectCircleHit(c.x,c.y,c.r-4,l)){c.alive=false;Audio.sfx('laser');}
    }
  }
}
function updateBoss(dt){
  const B=G.boss; if(!B) return;
  if(B.dead){
    if(B.deadTimer>0){
      B.deadTimer-=dt;
      if(B.deadTimer<=0){ B.deadTimer=0; }
    }
    return;
  }
  B.angle+=B.rotateSpeed*dt;
  B.laserAngle+=B.laserSpeed*dt;
  const wps=G.anchors.filter(a=>a.isWeak);
  for(const a of wps){
    if(a.dead) continue;
    const angle=B.angle+a.index*Math.PI*2/B.wpCount;
    a.x=B.x+Math.cos(angle)*B.r;
    a.y=B.y+Math.sin(angle)*B.r;
  }
  for(const att of G.rope.attached){
    if(att.anchor.isWeak && !att.anchor.dead && att.anchor.hp>0){
      att.anchor.hp-=dt;
      if(att.anchor.hp<=0){
        att.anchor.hp=0;att.anchor.dead=true;
        spawnParticles(att.anchor.x,att.anchor.y,'#ff4',28);
        Audio.sfx('hit');
        if(G.lum && G.lum.hooked && G.lum.hooked.anchor===att.anchor) G.lum.hooked=null;
        if(G.nox && G.nox.hooked && G.nox.hooked.anchor===att.anchor) G.nox.hooked=null;
        G.rope.attached=G.rope.attached.filter(x=>x.anchor!==att.anchor);
      }
    }
  }
  if(B.pull){
    for(const c of [G.lum,G.nox]){
      if(!c||!c.alive)continue;
      const dx=B.x-c.x,dy=B.y-c.y;
      const d=Math.hypot(dx,dy)||1;
      c.vx+=(dx/d)*B.pull*dt;
      c.vy+=(dy/d)*B.pull*dt;
    }
  }
  if(B.laserCount>0){
    for(let i=0;i<B.laserCount;i++){
      const a=B.laserAngle+i*Math.PI*2/B.laserCount;
      for(const c of [G.lum,G.nox]){
        if(!c||!c.alive||c.invuln>0)continue;
        const dx=c.x-B.x,dy=c.y-B.y;
        const dist=Math.hypot(dx,dy);
        if(dist<B.r) continue;
        const angle=Math.atan2(dy,dx);
        let diff=angle-a;
        while(diff>Math.PI)diff-=Math.PI*2;
        while(diff<-Math.PI)diff+=Math.PI*2;
        if(Math.abs(diff)<0.06 && dist<650){
          if(hasWallBetween(B.x,B.y,c.x,c.y)) continue;
          c.alive=false;Audio.sfx('laser');
        }
      }
    }
  }
  if(B.shootInterval>0){
    B.shootTimer+=dt;
    if(B.shootTimer>=B.shootInterval){
      B.shootTimer=0;
      Audio.sfx('shoot');
      if(B.type==='devourer'){
        for(const c of [G.lum,G.nox]){
          if(!c||!c.alive)continue;
          const dx=c.x-B.x,dy=c.y-B.y;
          const base=Math.atan2(dy,dx);
          const sp=200;
          for(let k=-1;k<=1;k++){
            const a=base+k*0.18;
            G.bossProjectiles.push({x:B.x,y:B.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:9,life:6,color:'#ff4'});
          }
        }
      } else if(B.type==='pulsar'||B.type==='symbiot'){
        const n=B.type==='symbiot'?12:10;
        const sp=B.type==='symbiot'?220:180;
        for(let i=0;i<n;i++){
          const a=i*Math.PI*2/n+B.angle;
          G.bossProjectiles.push({x:B.x,y:B.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:10,life:6,color:B.type==='symbiot'?'#c8f':'#4cf'});
        }
      }
    }
  }
  const aliveCount=wps.filter(a=>!a.dead).length;
  if(!B.dead && aliveCount===0){
    B.dead=true;
    B.deadTimer=PHYS.BOSS_DEATH_TIME;
    if(!G.winSfxPlayed){Audio.sfx('win');G.winSfxPlayed=true;}
    spawnParticles(B.x,B.y,'#ffe24a',60);
    G.shake=SAVE.settings.shake?20:0;
    toast(t('bossDefeated'));
  }
}
function updateBossProjectiles(dt){
  if(!G.bossProjectiles||!G.bossProjectiles.length) return;
  const [W,H]=G.level.size;
  for(let i=G.bossProjectiles.length-1;i>=0;i--){
    const p=G.bossProjectiles[i];
    const prevX=p.x, prevY=p.y;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0 || p.x<-80||p.x>W+80||p.y<-80||p.y>H+80){
      G.bossProjectiles.splice(i,1); continue;
    }
    if(hasWallBetween(prevX,prevY,p.x,p.y)){ G.bossProjectiles.splice(i,1); continue; }
    for(const c of [G.lum,G.nox]){
      if(!c||!c.alive||c.invuln>0) continue;
      if(Math.hypot(c.x-p.x,c.y-p.y) < c.r+p.r-3){
        c.alive=false; Audio.sfx('hit');
      }
    }
  }
}
function applyCollisionAndTrail(c,dt){
  for(const w of G.walls) resolveCircleRect(c,c.r,w);
  for(const d of G.doors){if(!d.open)resolveCircleRect(c,c.r,d);}
  for(const p of G.platforms) resolveCircleRect(c,c.r,{x:p.x,y:p.y,w:p.w,h:p.h});
  const [W,H]=G.level.size;
  if(c.x<c.r){c.x=c.r;c.vx=Math.max(0,c.vx);}
  if(c.x>W-c.r){c.x=W-c.r;c.vx=Math.min(0,c.vx);}
  if(c.y>H+c.r*6 && c.invuln<=0)c.alive=false;
  c.trailTimer-=dt;
  if(c.trailTimer<=0 && (Math.abs(c.vx)>80||Math.abs(c.vy)>100)){
    c.trail.push({x:c.x,y:c.y,life:0.5,max:0.5});c.trailTimer=0.03;
  }
  for(let i=c.trail.length-1;i>=0;i--){
    c.trail[i].life-=dt;
    if(c.trail[i].life<=0)c.trail.splice(i,1);
  }
}
function updateChar(c,dir,dt){
  if(!c.alive) return;
  c.jumpCooldown -= dt;
  if(c.invuln>0) c.invuln=Math.max(0,c.invuln-dt);
  if(c.throwAnim>0) c.throwAnim=Math.max(0,c.throwAnim-dt);

  if(c.hooked){
    if(dir.y < -0.4 && c.jumpCooldown <= 0){
      const a = c.hooked.anchor;
      a.cooldown = PHYS.HOOK_COOLDOWN;
      const dx = c.x - a.x, dy = c.y - a.y;
      const d = Math.hypot(dx,dy) || 1;
      c.vx = (dx/d) * 300;
      c.vy = -PHYS.JUMP_SPEED * 1.1;
      c.hooked = null;
      c.jumpCooldown = PHYS.JUMP_COOLDOWN;
      c.sqX = 0.7; c.sqY = 1.35;
      G.rope.attached = G.rope.attached.filter(x => x.anchor !== a);
      Audio.sfx('hook_release');
    } else {
      const a=c.hooked.anchor;
      const dx=a.x-c.x, dy=a.y-c.y;
      const dist=Math.hypot(dx,dy)||1;
      const restDist=PHYS.HOOK_REST;
      c.vy-=G.gravity*dt;
      if(dist>restDist){
        const pull=PHYS.HOOK_PULL;
        c.vx+=(dx/dist)*pull*dt;
        c.vy+=(dy/dist)*pull*dt;
        const vmax=PHYS.HOOK_VMAX;
        const v=Math.hypot(c.vx,c.vy);
        if(v>vmax){c.vx=c.vx/v*vmax;c.vy=c.vy/v*vmax;}
      } else {
        c.vx*=Math.pow(0.15,dt);
        c.vy*=Math.pow(0.15,dt);
        c.vy+=Math.sin(G.t*3+c.x*0.01)*20*dt;
      }
      c.onGround=false;
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      c.sqX=lerp(c.sqX,1,dt*14);
      c.sqY=lerp(c.sqY,1,dt*14);
      if(c.throwAnim>0){
        const k=c.throwAnim/0.22;
        c.sqX=Math.min(c.sqX,1-0.25*k);
        c.sqY=Math.max(c.sqY,1+0.3*k);
      }
      applyCollisionAndTrail(c,dt);
      return;
    }
  }

  const inGoo=G.goo.some(g=>c.x>g.x-4&&c.x<g.x+g.w+4&&c.y>g.y-4&&c.y<g.y+g.h+4);
  c.inGoo=inGoo;
  if(c.onGround) c.coyoteTimer=PHYS.COYOTE;
  else c.coyoteTimer=Math.max(0,c.coyoteTimer-dt);
  const accel=(c.onGround?PHYS.ACCEL_GROUND:PHYS.ACCEL_AIR)*(inGoo?PHYS.GOO_SPEED:1);
  c.vx+=dir.x*accel*dt;
  c.vy+=G.gravity*dt;
  if(c.onGround){
    const decay=inGoo?PHYS.GOO_DECAY:PHYS.GROUND_DECAY;
    c.vx*=Math.max(0,1-decay*dt);
  } else c.vx*=Math.pow(PHYS.AIR_DECAY,dt);
  let didJump=false;
  if(dir.y<-0.4 && c.coyoteTimer>0 && c.jumpCooldown<=0){
    const jumpMul=inGoo?PHYS.GOO_SPEED:1;
    c.vy=-PHYS.JUMP_SPEED*jumpMul;
    c.jumpCooldown=PHYS.JUMP_COOLDOWN;c.coyoteTimer=0;
    Audio.sfx('jump');c.sqX=0.75;c.sqY=1.3;didJump=true;
  }
  const maxVx=PHYS.MAX_VX*(inGoo?PHYS.GOO_SPEED:1);
  if(Math.abs(c.vx)>maxVx)c.vx=Math.sign(c.vx)*maxVx;
  if(Math.abs(c.vy)>PHYS.MAX_VY)c.vy=Math.sign(c.vy)*PHYS.MAX_VY;
  const wasAir=!c.onGround;
  c.onGround=false;
  c.x+=c.vx*dt;c.y+=c.vy*dt;
  applyCollisionAndTrail(c,dt);
  if(wasAir && c.onGround && !didJump){
    const fallSpeed=Math.abs(c.vy);
    if(fallSpeed>300){c.sqX=1.35;c.sqY=0.7;}
  }
  c.sqX=lerp(c.sqX,1,dt*14);c.sqY=lerp(c.sqY,1,dt*14);
  if(c.throwAnim>0){
    const k=c.throwAnim/0.22;
    c.sqX=Math.min(c.sqX,1-0.25*k);
    c.sqY=Math.max(c.sqY,1+0.3*k);
  }
}
function checkSpikes(c){
  if(!c.alive||c.invuln>0)return;
  const tag=(c===G.lum?'lum':'nox');
  for(const s of G.spikes){
    if(s.type!=='both'&&s.type!==tag)continue;
    if(rectCircleHit(c.x,c.y,c.r-5,s)){c.alive=false;return;}
  }
}
function checkCores(){
  for(const core of G.cores){
    if(core.taken)continue;
    if(Math.hypot(G.lum.x-core.x,G.lum.y-core.y)<75 &&
       Math.hypot(G.nox.x-core.x,G.nox.y-core.y)<75){
      core.taken=true;G.collectedCores++;
      Audio.sfx('core');spawnParticles(core.x,core.y,'#ffe24a',26);
      updateHudCores();
    }
  }
}
function checkButtons(){
  for(const b of G.buttons){
    if(b.locked)continue;
    const pressed=Math.hypot(G.lum.x-b.x,G.lum.y-b.y)<40||Math.hypot(G.nox.x-b.x,G.nox.y-b.y)<40;
    if(pressed&&!b.pressed){b.pressed=true;Audio.sfx('door');if(b.stay)b.locked=true;}
    else if(!pressed&&b.pressed&&!b.stay){b.pressed=false;}
  }
  for(const d of G.doors){
    const bs=G.buttons.filter(b=>b.id===d.id);
    const all=bs.length>0 && bs.every(b=>b.pressed);
    if(all&&!d.open){d.open=true;Audio.sfx('door');}
    else if(!all&&d.open && !bs.some(b=>b.stay)){d.open=false;}
  }
}
function checkExit(){
  if(G.boss && !G.boss.dead) return;
  const inE=c=>c.x>G.exit.x&&c.x<G.exit.x+G.exit.w&&c.y>G.exit.y&&c.y<G.exit.y+G.exit.h;
  if(inE(G.lum)&&inE(G.nox)&&G.lum.alive&&G.nox.alive) completeLevel();
}
function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2),sp=rnd(60,300);
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.5,1.3),color,size:rnd(2,4)});
  }
}
function updateParticles(dt){
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=Math.pow(0.1,dt);p.vy*=Math.pow(0.1,dt);p.vy+=400*dt;
    p.life-=dt;
    if(p.life<=0)G.particles.splice(i,1);
  }
}
function updateGame(dt){
  G.time+=dt;G.t+=dt;
  const inp=readInput();
  updatePlatforms(dt);
  updateLasers(dt);
  updateBoss(dt);
  updateBossProjectiles(dt);
  updateChar(G.lum,inp.lum,dt);
  updateChar(G.nox,inp.nox,dt);
  updateHooks(dt);
  G.rope.update(dt,G.gravity);

  for(const c of [G.lum,G.nox]){
    if(c.hooked){
      c.hooked.timer-=dt;
      if(c.hooked.timer<=0){
        c.hooked.anchor.cooldown=PHYS.HOOK_COOLDOWN;
        c.hooked=null;
        Audio.sfx('hook_release');
        if(SAVE.settings.shake) G.shake=Math.max(G.shake,6);
      }
    }
  }
  const hookedCount=(G.lum.hooked?1:0)+(G.nox.hooked?1:0);
  const targetRope=G.baseMaxRope*(1-0.25*hookedCount);
  G.maxRope=lerp(G.maxRope,targetRope,0.03);
  if(G.rope) G.rope.rest=G.rope.baseRest*(G.maxRope/G.baseMaxRope);

  for(const a of G.anchors){
    if(a.cooldown>0) a.cooldown-=dt;
  }
  for(let i=G.rope.attached.length-1;i>=0;i--){
    const att=G.rope.attached[i];
    if(att.anchor.isWeak) continue;
    att.lifeLeft-=dt;
    if(att.lifeLeft<=0){att.anchor.cooldown=PHYS.HOOK_COOLDOWN;G.rope.attached.splice(i,1);}
  }

  checkSpikes(G.lum);checkSpikes(G.nox);
  checkCores();checkButtons();

  if(!G.lum.alive||!G.nox.alive){
    Audio.sfx('die');
    const dead=!G.lum.alive?G.lum:G.nox;
    spawnParticles(dead.x,dead.y,dead===G.lum?G.skinLum.col:G.skinNox.col,30);
    G.shake=SAVE.settings.shake?14:0;
    if(G.boss){
      for(const a of G.anchors){
        if(a.isWeak && a.dead){ a.dead=false; a.hp=a.level; }
      }
      if(G.boss.dead){ G.boss.dead=false; G.boss.deadTimer=0; }
      G.boss.laserAngle=-Math.PI/2;
      G.boss.angle=0;
      G.boss.shootTimer=0;
    }
    G.lum.reset();G.nox.reset();G.rope.reset();
    G.bossProjectiles=[];
    G.lum.hooked=null; G.nox.hooked=null;
    for(const a of G.anchors){ a.cooldown=0; }
    G.rope.attached=[];
    G.maxRope=G.baseMaxRope;
    if(G.rope) G.rope.rest=G.rope.baseRest;
  }

  const dx=G.nox.x-G.lum.x,dy=G.nox.y-G.lum.y;
  const d=Math.hypot(dx,dy);
  G.tension=lerp(G.tension,clamp(d/G.maxRope,0,1),0.12);
  if(d>G.maxRope){
    const over=Math.min(d-G.maxRope,100);
    const nxv=dx/d,nyv=dy/d,k=30;
    const fx=nxv*over*k*dt,fy=nyv*over*k*dt;
    G.lum.vx+=fx;G.lum.vy+=fy;
    G.nox.vx-=fx;G.nox.vy-=fy;
  }
  checkExit();
  updateParticles(dt);
  updateCameraFollow();
  Audio.setTension(G.tension);

  if(G.tutTimer>0){
    G.tutTimer-=dt;
    if(G.tutTimer<=0){
      if(G.tutQueue.length>0){
        const step=G.tutQueue.shift();
        G.tutCurrent=step[LANG]||step.ru;
        G.tutTimer=4.5;
      } else {
        G.tutCurrent='';
        G.tutTimer=0;
      }
      updateTutorialUI();
    }
  }
  updateHookButton();
}

function render(dt){
  const W=canvas.clientWidth,H=canvas.clientHeight;
  let sx=0,sy=0;
  if(G.shake>0.1){sx=rnd(-G.shake,G.shake);sy=rnd(-G.shake,G.shake);G.shake*=0.9;}
  const grad=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,Math.max(W,H)*0.7);
  grad.addColorStop(0,CUR_PAL.bg1);grad.addColorStop(1,CUR_PAL.bg2);
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  const inLevel=G.state==='playing'||G.state==='paused'||G.state==='complete';
  if(inLevel && G.level){
    if(HQ()){
      renderLevel(dt,W,H,sx,sy);
      bloomCtx.setTransform(1,0,0,1,0,0);
      bloomCtx.clearRect(0,0,bloomCanvas.width,bloomCanvas.height);
      bloomCtx.drawImage(canvas,0,0);
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=0.3;
      ctx.filter='blur(8px)';
      ctx.drawImage(bloomCanvas,0,0,W,H);
      ctx.filter='none';
      ctx.restore();
    } else {
      renderLevel(dt,W,H,sx,sy);
    }
  } else renderMenuBg(dt,W,H);
  if(G.state==='playing' && IS_TOUCH) renderSticks(W,H);
}
function renderLevel(dt,W,H,sx,sy){
  const s=G.camera.scale;
  ctx.save();
  ctx.translate(G.camera.x+sx,G.camera.y+sy);
  ctx.scale(s,s);
  const [LW,LH]=G.level.size;
  ctx.strokeStyle=CUR_PAL.grid;ctx.lineWidth=1;
  ctx.beginPath();
  const grid=80;
  for(let x=0;x<=LW;x+=grid){ctx.moveTo(x,0);ctx.lineTo(x,LH);}
  for(let y=0;y<=LH;y+=grid){ctx.moveTo(0,y);ctx.lineTo(LW,y);}
  ctx.stroke();
  for(const w of G.walls){
    ctx.fillStyle=w._grad||CUR_PAL.wallBot;
    ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.strokeStyle=CUR_PAL.wallTop.replace('0.40','0.7');ctx.lineWidth=1.5;
    ctx.strokeRect(w.x+0.5,w.y+0.5,w.w-1,w.h-1);
  }
  if(G.boss && (!G.boss.dead || G.boss.deadTimer>0)) drawBoss(G.boss, G.t);
  for(const p of G.platforms){
    ctx.strokeStyle='rgba(80,180,255,0.15)';ctx.lineWidth=1;
    ctx.setLineDash([6,8]);
    ctx.beginPath();ctx.moveTo(p.ax+p.w/2,p.ay+p.h/2);ctx.lineTo(p.bx+p.w/2,p.by+p.h/2);ctx.stroke();
    ctx.setLineDash([]);
    const g=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
    g.addColorStop(0,'rgba(120,200,255,0.6)');g.addColorStop(1,'rgba(40,100,180,0.7)');
    ctx.fillStyle=g;ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.strokeStyle='rgba(180,230,255,0.9)';ctx.lineWidth=2;
    ctx.strokeRect(p.x+1,p.y+1,p.w-2,p.h-2);
  }
  for(const g of G.goo){
    const gg=ctx.createLinearGradient(g.x,g.y,g.x,g.y+g.h);
    gg.addColorStop(0,'rgba(80,200,80,0.35)');gg.addColorStop(1,'rgba(40,100,40,0.55)');
    ctx.fillStyle=gg;ctx.fillRect(g.x,g.y,g.w,g.h);
    ctx.strokeStyle='rgba(160,255,160,0.4)';
    for(let i=0;i<6;i++){
      const bx=g.x+((i*97)%g.w),by=g.y+g.h*0.5+Math.sin(G.t*2+i)*8;
      ctx.beginPath();ctx.arc(bx,by,3,0,Math.PI*2);ctx.stroke();
    }
  }
  for(const sp of G.spikes){
    const col=sp.type==='lum'?'#4ff':sp.type==='nox'?'#f4f':'#f44';
    ctx.fillStyle=col;ctx.globalAlpha=0.85;
    const cols=Math.max(2,Math.floor(sp.w/16));
    for(let i=0;i<cols;i++){
      const x=sp.x+i*(sp.w/cols),w=sp.w/cols;
      ctx.beginPath();
      if(sp.type==='lum'){
        ctx.moveTo(x+w/2,sp.y);ctx.lineTo(x+w*0.7,sp.y+sp.h*0.6);ctx.lineTo(x+w,sp.y+sp.h);
        ctx.lineTo(x+w/2,sp.y+sp.h*0.7);ctx.lineTo(x,sp.y+sp.h);ctx.lineTo(x+w*0.3,sp.y+sp.h*0.6);
      } else if(sp.type==='nox'){
        ctx.moveTo(x,sp.y);ctx.lineTo(x+w,sp.y);ctx.lineTo(x+w/2,sp.y+sp.h);
      } else {
        ctx.moveTo(x,sp.y+sp.h);ctx.lineTo(x+w/2,sp.y);ctx.lineTo(x+w,sp.y+sp.h);
      }
      ctx.closePath();ctx.fill();
    }
    ctx.globalAlpha=1;
    if(MQ()){ctx.shadowColor=col;ctx.shadowBlur=14;}
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.strokeRect(sp.x,sp.y,sp.w,sp.h);
    ctx.shadowBlur=0;
  }
  for(const l of G.lasers){
    const vertical=l.h>l.w;
    ctx.fillStyle='rgba(255,80,80,0.9)';
    if(vertical){
      ctx.beginPath();ctx.arc(l.x+l.w/2,l.y,7,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(l.x+l.w/2,l.y+l.h,7,0,Math.PI*2);ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(l.x,l.y+l.h/2,7,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(l.x+l.w,l.y+l.h/2,7,0,Math.PI*2);ctx.fill();
    }
    if(l.active){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const pulse=0.85+Math.sin(G.t*30)*0.1;
      if(HQ()){ctx.shadowColor='#ff3060';ctx.shadowBlur=26;}
      ctx.fillStyle=`rgba(255,80,140,${pulse})`;
      if(vertical)ctx.fillRect(l.x+l.w*0.25,l.y,l.w*0.5,l.h);
      else ctx.fillRect(l.x,l.y+l.h*0.25,l.w,l.h*0.5);
      ctx.restore();
    } else {
      ctx.strokeStyle='rgba(255,80,140,0.25)';ctx.lineWidth=1;
      ctx.strokeRect(l.x,l.y,l.w,l.h);
    }
  }
  for(const a of G.anchors){
    if(a.dead) continue;
    ctx.save();ctx.translate(a.x,a.y);
    const pulse=1+Math.sin(G.t*3)*0.12;
    const held=G.rope.attached.some(x=>x.anchor===a);
    const hooked=(G.lum.hooked&&G.lum.hooked.anchor===a)||(G.nox.hooked&&G.nox.hooked.anchor===a);
    const incoming=(G.lum&&G.lum.hook&&G.lum.hook.anchor===a)||(G.nox&&G.nox.hook&&G.nox.hook.anchor===a);
    if(a.isWeak){
      const hpRatio=a.hp/a.level;
      const col=hpRatio>0.5?'#f66':hpRatio>0?'#fa0':'#444';
      ctx.fillStyle=col;
      if(MQ()){ctx.shadowColor=col;ctx.shadowBlur=22;}
      ctx.beginPath();ctx.arc(0,0,11*pulse,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,18,-Math.PI/2,-Math.PI/2+Math.PI*2*hpRatio);ctx.stroke();
    } else {
      /* ПАТЧ: читаемый if/else вместо вложенных тернарников */
      let strokeCol='rgba(255,220,80,0.9)';
      if(hooked||held) strokeCol='#ff0';
      else if(incoming) strokeCol='#fc0';
      else if(a.cooldown>0) strokeCol='rgba(255,220,80,0.3)';
      ctx.strokeStyle=strokeCol;
      ctx.lineWidth=incoming?4:3;
      ctx.beginPath();ctx.arc(0,0,16*pulse,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.stroke();
      if(held){
        const att=G.rope.attached.find(x=>x.anchor===a);
        if(att){
          ctx.strokeStyle='rgba(255,255,100,0.6)';
          ctx.beginPath();ctx.arc(0,0,22,-Math.PI/2,-Math.PI/2+(att.lifeLeft/PHYS.HOOK_HOLD)*Math.PI*2);ctx.stroke();
        }
      }
    }
    ctx.restore();
  }
  for(const c of G.cores){
    if(c.taken)continue;
    drawCore(c.x,c.y,G.t);
  }
  for(const b of G.buttons){
    ctx.fillStyle=b.pressed?'#4f8':'#666';
    ctx.beginPath();ctx.arc(b.x,b.y,11,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=b.stay?'#ff0':'#fff';ctx.lineWidth=2;ctx.stroke();
  }
  for(const d of G.doors){
    if(d.open)continue;
    ctx.fillStyle='rgba(200,60,80,0.7)';ctx.fillRect(d.x,d.y,d.w,d.h);
    ctx.strokeStyle='rgba(255,120,140,0.9)';ctx.lineWidth=2;
    ctx.strokeRect(d.x+1,d.y+1,d.w-2,d.h-2);
  }
  if(!G.boss || G.boss.dead){
    const ex=G.exit;
    ctx.save();
    const pulse=0.6+Math.sin(G.t*3)*0.2;
    if(MQ()){ctx.shadowColor='#4f8';ctx.shadowBlur=30;}
    ctx.strokeStyle=`rgba(80,255,140,${pulse})`;ctx.lineWidth=3;
    ctx.strokeRect(ex.x,ex.y,ex.w,ex.h);
    ctx.fillStyle=`rgba(80,255,140,${pulse*0.15})`;
    ctx.fillRect(ex.x,ex.y,ex.w,ex.h);
    ctx.restore();
  }
  if(G.rope){
    const pts=G.rope.points,te=G.tension;
    const r=Math.floor(lerp(80,255,te*te));
    const g=Math.floor(lerp(255,80,te));
    const b=Math.floor(lerp(255,180,te));
    ctx.save();ctx.globalCompositeOperation='lighter';
    if(HQ()){ctx.shadowColor=`rgba(${r},${g},${b},0.9)`;ctx.shadowBlur=16;}
    ctx.strokeStyle=`rgba(${r},${g},${b},0.95)`;
    ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++){
      const p=pts[i],pp=pts[i-1];
      const mx=(p.x+pp.x)/2,my=(p.y+pp.y)/2;
      ctx.quadraticCurveTo(pp.x,pp.y,mx,my);
    }
    const last=pts[pts.length-1];
    ctx.lineTo(last.x,last.y);ctx.stroke();
    ctx.restore();
  }
  for(const c of [G.lum,G.nox]){
    if(!c||!c.hook)continue;
    ctx.save();
    ctx.strokeStyle='rgba(255,220,80,0.85)';
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.hook.x,c.hook.y);ctx.stroke();
    ctx.fillStyle='#ffe24a';
    if(MQ()){ctx.shadowColor='#ffe24a';ctx.shadowBlur=16;}
    ctx.beginPath();ctx.arc(c.hook.x,c.hook.y,5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  for(const c of [G.lum,G.nox]){
    if(!c||!c.hooked)continue;
    ctx.save();
    ctx.strokeStyle='rgba(255,220,80,0.9)';
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.hooked.anchor.x,c.hooked.anchor.y);ctx.stroke();
    ctx.fillStyle='#ffe24a';
    if(MQ()){ctx.shadowColor='#ffe24a';ctx.shadowBlur=14;}
    ctx.beginPath();ctx.arc(c.hooked.anchor.x,c.hooked.anchor.y,4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  for(const c of [G.lum,G.nox]){
    if(!c||!c.alive)continue;
    ctx.save();ctx.globalCompositeOperation='lighter';
    const sk=c===G.lum?G.skinLum:G.skinNox;
    for(const tp of c.trail){
      ctx.globalAlpha=(tp.life/tp.max)*0.45;
      ctx.fillStyle=sk.trail;
      ctx.beginPath();ctx.arc(tp.x,tp.y,5*(tp.life/tp.max),0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  drawChar(G.lum,'lum');
  drawChar(G.nox,'nox');
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of G.particles){
    ctx.globalAlpha=clamp(p.life,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

function drawShape(shape,R,col,col2,pulse,t){

      ctx.fillStyle=col2;
      ctx.beginPath();

}

      c.bezierCurveTo(r*0.4,-r*1.1,r*0.95,-r*0.4,r*0.75,r*0.3);
      c.bezierCurveTo(r*0.6,r*0.95,0,r*1.15,0,r*1.15);
      c.bezierCurveTo(0,r*1.15,-r*0.6,r*0.95,-r*0.75,r*0.3);
      c.bezierCurveTo(-r*0.95,-r*0.4,-r*0.4,-r*1.1,0,-r*1.4);
      c.closePath();c.fill();
      c.fillStyle=col2;
      c.beginPath();
      c.moveTo(0,-r*0.6);
      c.bezierCurveTo(r*0.4,-r*0.2,r*0.35,r*0.5,0,r*0.7);
      c.bezierCurveTo(-r*0.35,r*0.5,-r*0.4,-r*0.2,0,-r*0.6);
      c.closePath();c.fill();
      break;
    }
    case 'shard':{
      const r=R*pulse;
      c.save();c.rotate(t*1.5);
      c.beginPath();
      c.moveTo(0,-r*1.2);c.lineTo(r*0.55,-r*0.35);
      c.lineTo(r*1.05,r*0.1);c.lineTo(r*0.5,r*0.95);
      c.lineTo(0,r*1.15);c.lineTo(-r*0.7,r*0.6);
      c.lineTo(-r*1.0,-r*0.15);c.lineTo(-r*0.5,-r*0.95);
      c.closePath();c.fill();
      c.fillStyle='#050510';
      c.beginPath();c.arc(0,0,r*0.4,0,Math.PI*2);c.fill();
      c.strokeStyle=col2;c.lineWidth=1.4;
      c.beginPath();c.arc(0,0,r*0.4,0,Math.PI*2);c.stroke();
      c.restore();
      break;
    }
  }
  c.restore();
  c.restore();
}

function hideScreens(){$$('.screen').forEach(s=>s.classList.remove('active'));}
function showScreen(id){
  $$('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  const inLevel=G.state==='playing'||G.state==='paused'||G.state==='complete';
  $('#hud').classList.toggle('hidden',!inLevel);
  updateHookButton();
  if(id==='s-menu') refreshMenu();
}
function refreshMenu(){
  const btn=$('#btnContinue');
  if(hasProgress()) btn.classList.remove('hidden');
  else btn.classList.add('hidden');
}
function applyLang(){
  document.documentElement.lang=LANG;
  $$('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  buildLevelsGrid();buildShopGrid();refreshMenu();
}
function buildLevelsGrid(){
  const g=$('#levelsGrid'); g.innerHTML='';
  $('#coresTotal').textContent='◆ '+totalCores()+' / '+TOTAL_CORES;
  LEVELS.forEach((L,i)=>{
    const id=i+1;
    const unlocked=isUnlocked(id);
    const coresHere=SAVE.progress.cores[id]||0;
    const beaten=isCompleted(id);
    const div=document.createElement('div');
    div.className='lvl-card'+(unlocked?'':' locked')+(beaten?' done':'')+(L.isBoss?' boss':'');
    const maxCores=L.cores?L.cores.length:3;
    const coreStr='◆'.repeat(Math.min(coresHere,maxCores))+'◇'.repeat(Math.max(0,maxCores-coresHere));
    const lock=unlocked?'':'<div class="lockicon">🔒</div>';
    const label=L.isBoss?'☠ '+id:id;
    div.innerHTML=`<div class="num">${unlocked?label:'?'}</div>`+lock+
      `<div class="nm">${L.name[LANG]||L.name.ru}</div>`+
      `<div class="cores">${coreStr}</div>`;
    div.onclick=()=>{
      if(!unlocked){Audio.sfx('locked');toast(t('lockedHint'));return;}
      startLevel(i);
    };
    g.appendChild(div);
  });
}
function buildShopGrid(){
  const g=$('#shopGrid'); if(!g) return;
  g.innerHTML='';
  _shopPreviews.length=0;
  $('#shopTotal').textContent='◆ '+totalCores();
  const activeId=c=>c==='lum'?SAVE.progress.activeLum:SAVE.progress.activeNox;
  const order=['lum_default','lum_gold','lum_crystal','lum_void',
               'nox_default','nox_ice','nox_flame','nox_void'];
  for(const id of order){
    const s=SKINS[id]; if(!s) continue;
    const owned=ownedSkin(id);
    const equipped=activeId(s.char)===id;
    const div=document.createElement('div');
    div.className='shop-item'+(owned?' owned':'')+(equipped?' equipped':'');
    const price=s.cost===0?(owned?'':`◆ 0`):(owned?t('owned'):`◆ ${s.cost}`);
    div.innerHTML=
      `<div class="preview"><canvas width="64" height="64"></canvas></div>`+
      `<div class="sn">${s.name[LANG]||s.name.ru}</div>`+
      `<div class="sp">${owned?(equipped?t('equipped'):t('equip')):price}</div>`+
      `<div class="sl">${s.char==='lum'?'ЛЮМ':'НОКС'}</div>`;
    div.onclick=()=>{
      if(equipped){Audio.sfx('click');return;}
      if(owned){
        if(s.char==='lum')SAVE.progress.activeLum=id;else SAVE.progress.activeNox=id;
        persist();Audio.sfx('click');buildShopGrid();
      } else {
        if(totalCores()>=s.cost){
          SAVE.progress.owned.push(id);
          if(s.char==='lum')SAVE.progress.activeLum=id;else SAVE.progress.activeNox=id;
          persist();Audio.sfx('buy');
          toast(t('bought')+' — '+(s.name[LANG]||s.name.ru));
          buildShopGrid();
        } else {
          Audio.sfx('locked');
          toast(`${t('need')}: ◆ ${s.cost-totalCores()}`);
        }
      }
    };
    g.appendChild(div);
    const canvasEl=div.querySelector('canvas');
    if(canvasEl) drawSkinPreview(canvasEl,id);
  }
}
function toast(msg){
  const el=$('#toast'); el.textContent=msg;
  el.classList.add('show');
  clearTimeout(el._to);
  el._to=setTimeout(()=>el.classList.remove('show'),2600);
}
function startLevel(idx){
  loadLevel(idx); G.state='playing';
  hideScreens();
  $('#hud').classList.remove('hidden');
  $('#hudLevel').textContent=t('level')+' '+(idx+1);
  updateHudCores();
  Audio.resume(); Audio.unduckMusic();
  updateHookButton();
}
function updateHudCores(){
  $('#hudCores').textContent=G.collectedCores+' / '+G.cores.length;
}
function pauseGame(){
  G.state='paused'; showScreen('s-pause'); Audio.duckMusic();
  G.shake=0;
  const el=$('#toast'); if(el) el.classList.remove('show');
  const tut=$('#tutorial'); if(tut) tut.classList.remove('show');
}
function resumeGame(){
  G.state='playing'; hideScreens();
  Audio.unduckMusic();
  updateTutorialUI();
}
function completeLevel(){
  if(G.state!=='playing')return;
  G.state='complete'; if(!G.winSfxPlayed){Audio.sfx('win');G.winSfxPlayed=true;} Audio.duckMusic();
  G.shake=0;
  const id=G.levelIndex+1;
  const prev=SAVE.progress.cores[id]||0;
  if(G.collectedCores>prev) SAVE.progress.cores[id]=G.collectedCores;
  if(!SAVE.progress.completed) SAVE.progress.completed={};
  SAVE.progress.completed[id]=true;
  persist();
  const nextId=id+1;
  let nextInfo='';
  if(nextId<=LEVELS.length){
    nextInfo=`<span style="color:#4f8">→ ${t('level')} ${nextId}</span>`;
  }
  const maxC=G.cores.length;
  $('#completeStats').innerHTML=
    `${t('level')} ${id}: ${G.level.name[LANG]||G.level.name.ru}<br>`+
    `${t('cores')}: <span style="color:#ffe24a">${'◆'.repeat(G.collectedCores)}${'◇'.repeat(Math.max(0,maxC-G.collectedCores))}</span><br>`+
    `${t('time')}: ${G.time.toFixed(1)}s<br>`+
    `<span style="font-size:.8em;opacity:.8">${t('total')}: ◆ ${totalCores()} / ${TOTAL_CORES}</span><br>`+
    nextInfo;
  showScreen('s-complete');
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action],[data-lang]');
  if(!el)return;
  Audio.resume(); Audio.sfx('click');
  if(el.dataset.lang){LANG=el.dataset.lang;SAVE.lang=LANG;persist();applyLang();return;}
  const a=el.dataset.action;
  switch(a){
    case 'continue': {
      let top=1;
      for(let i=LEVELS.length;i>=1;i--){if(isUnlocked(i)){top=i;break;}}
      startLevel(top-1); break;
    }
    case 'newgame':
      if(confirm(t('newGameConfirm'))){
        SAVE.progress={cores:{},completed:{},started:true,tutorialSeen:{},
          owned:['lum_default','nox_default'],
          activeLum:'lum_default',activeNox:'nox_default'};
        persist(); startLevel(0);
      } break;
    case 'levels': G.state='levels'; showScreen('s-levels'); buildLevelsGrid(); break;
    case 'shop': G.state='shop'; showScreen('s-shop'); buildShopGrid(); break;
    case 'settings': G.state='settings'; showScreen('s-settings'); syncSettingsUI(); break;
    case 'lang': G.state='lang'; showScreen('s-lang'); break;
    case 'back-menu': G.state='menu'; showScreen('s-menu'); Audio.stopDrone(); break;
    case 'resume': resumeGame(); break;
    case 'restart':
      if(G.collectedCores>0 && !confirm(t('exitConfirm'))) break;
      startLevel(G.levelIndex); break;
    case 'levels-pause':
      if(G.collectedCores>0 && !confirm(t('exitConfirm'))) break;
      Audio.stopDrone(); G.state='levels'; showScreen('s-levels'); buildLevelsGrid(); break;
    case 'settings-pause': G.state='settings'; showScreen('s-settings'); syncSettingsUI(); break;
    case 'menu-pause':
      if(G.collectedCores>0 && !confirm(t('exitConfirm'))) break;
      Audio.stopDrone(); G.state='menu'; showScreen('s-menu'); break;
    case 'next':
      if(G.levelIndex+1<LEVELS.length) startLevel(G.levelIndex+1);
      else { Audio.stopDrone(); G.state='menu'; showScreen('s-menu'); toast(t('allDone')); }
      break;
    case 'restart-complete': startLevel(G.levelIndex); break;
    case 'levels-complete': Audio.stopDrone(); G.state='levels'; showScreen('s-levels'); buildLevelsGrid(); break;
    case 'reset':
      if(confirm(t('resetConfirm'))){
        SAVE.progress={cores:{},completed:{},started:false,tutorialSeen:{},
          owned:['lum_default','nox_default'],
          activeLum:'lum_default',activeNox:'nox_default'};
        persist(); buildLevelsGrid(); buildShopGrid(); toast(LANG==='ru'?'Готово':'Done');
      } break;
  }
});
$('#btnPause').onclick=()=>{if(G.state==='playing')pauseGame();};
function syncSettingsUI(){
  $('#set-music').value=SAVE.settings.music;
  $('#set-sfx').value=SAVE.settings.sfx;
  $('#set-quality').value=SAVE.settings.quality;
  $('#set-shake').checked=SAVE.settings.shake;
  $('#set-deadzone').value=SAVE.settings.deadzone;
}
$('#set-music').oninput=e=>{SAVE.settings.music=+e.target.value;
  if(Audio.musicGain)Audio.musicGain.gain.value=SAVE.settings.music*(G.state==='playing'?.5:.15);persist();};
$('#set-sfx').oninput=e=>{SAVE.settings.sfx=+e.target.value;
  if(Audio.sfxGain)Audio.sfxGain.gain.value=SAVE.settings.sfx*.7;persist();};
$('#set-quality').onchange=e=>{SAVE.settings.quality=e.target.value;persist();};
$('#set-shake').onchange=e=>{SAVE.settings.shake=e.target.checked;persist();};
$('#set-deadzone').oninput=e=>{SAVE.settings.deadzone=+e.target.value;persist();};

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  const DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=w*DPR;canvas.height=h*DPR;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bloomCanvas.width=canvas.width;bloomCanvas.height=canvas.height;
  if(G.level)computeCamera();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
let lastT=performance.now(),acc=0;
const FIXED=1/60;
window.addEventListener('visibilitychange',()=>{lastT=performance.now();acc=0;});
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,(t-lastT)/1000);
  lastT=t;acc+=dt;
  let steps=0;
  while(acc>=FIXED && steps<5){
    acc-=FIXED;steps++;
    if(G.state==='playing')updateGame(FIXED);
  }
  render(dt);
  if(G.state==='shop'){
    const tt=performance.now()*0.002;
    for(const p of _shopPreviews){
      if(!p.canvas.isConnected) continue;
      renderSkinPreviewFrame(p.canvas,p.skinId,tt);
    }
  }
}
resize(); applyLang(); showScreen('s-menu');
requestAnimationFrame(loop);
</script>
